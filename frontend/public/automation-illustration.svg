<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Gradient Definitions -->
    <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#EFF6FF"/>
            <stop offset="100%" stop-color="#F8FAFC"/>
        </linearGradient>
        <linearGradient id="glowGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="600" height="400" fill="url(#bgGradient)"/>
    
    <!-- User Node (Start and End) -->
    <g transform="translate(50,150)">
        <circle cx="30" cy="30" r="40" fill="white" stroke="#3B82F6" stroke-width="2"/>
        <text x="30" y="40" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji" font-size="24">👨‍💻</text>
        <text x="30" y="85" text-anchor="middle" fill="#1E40AF" font-size="14">User</text>
    </g>

    <!-- AI Agents Hub -->
    <g transform="translate(200,50)">
        <rect width="200" height="160" rx="12" fill="white" stroke="#3B82F6" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" fill="#1E40AF" font-size="16" font-weight="bold">AI Agents</text>
        
        <!-- Individual Agents -->
        <g transform="translate(20,50)">
            <!-- Agent 1 -->
            <circle cx="30" cy="30" r="25" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
            <text x="30" y="38" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji" font-size="20">🤖</text>
            
            <!-- Agent 2 -->
            <circle cx="100" cy="30" r="25" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
            <text x="100" y="38" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji" font-size="20">🔍</text>
            
            <!-- Agent 3 -->
            <circle cx="160" cy="30" r="25" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
            <text x="160" y="38" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji" font-size="20">⚡</text>
            
            <!-- Agent Connection Lines -->
            <path d="M55,30 H75" stroke="#3B82F6" stroke-width="2"/>
            <path d="M125,30 H135" stroke="#3B82F6" stroke-width="2"/>
            
            <!-- Processing Indicators -->
            <circle cx="30" cy="70" r="3" fill="#3B82F6">
                <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="100" cy="70" r="3" fill="#3B82F6">
                <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" begin="0.3s"/>
            </circle>
            <circle cx="160" cy="70" r="3" fill="#3B82F6">
                <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" begin="0.6s"/>
            </circle>
        </g>
    </g>

    <!-- Task Execution Area -->
    <g transform="translate(450,100)">
        <rect width="100" height="120" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
        <text x="50" y="35" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji" font-size="24">🌐</text>
        <text x="50" y="65" text-anchor="middle" fill="#1E40AF" font-size="12">Web Tasks</text>
        
        <!-- Animated Task Lines -->
        <g>
            <rect x="20" y="80" width="60" height="6" rx="3" fill="#EFF6FF"/>
            <rect x="20" y="80" width="0" height="6" rx="3" fill="#3B82F6">
                <animate attributeName="width" values="0;60" dur="2s" repeatCount="indefinite"/>
            </rect>
            
            <rect x="20" y="95" width="60" height="6" rx="3" fill="#EFF6FF"/>
            <rect x="20" y="95" width="0" height="6" rx="3" fill="#3B82F6">
                <animate attributeName="width" values="0;60" dur="2s" repeatCount="indefinite" begin="0.5s"/>
            </rect>
        </g>
    </g>

    <!-- Results Flow -->
    <g transform="translate(200,250)">
        <rect width="200" height="100" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji" font-size="24">📊</text>
        <text x="100" y="65" text-anchor="middle" fill="#1E40AF" font-size="14">Task Results</text>
        
        <!-- Result Indicators -->
        <g transform="translate(30,75)">
            <circle cx="0" cy="0" r="5" fill="#22C55E"/>
            <text x="15" y="5" fill="#1E40AF" font-size="12">Success</text>
            <circle cx="80" cy="0" r="5" fill="#3B82F6"/>
            <text x="95" y="5" fill="#1E40AF" font-size="12">Progress</text>
        </g>
    </g>

    <!-- Flow Arrows -->
    <g>
        <!-- User to AI -->
        <path d="M120,180 Q180,180 200,130" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <circle cx="0" cy="0" r="3" fill="#60A5FA">
            <animateMotion path="M120,180 Q180,180 200,130" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <!-- AI to Tasks -->
        <path d="M400,130 H450" stroke="#3B82F6" stroke-width="2"/>
        <circle cx="0" cy="0" r="3" fill="#60A5FA">
            <animateMotion path="M400,130 H450" dur="1s" repeatCount="indefinite"/>
        </circle>

        <!-- Tasks to Results -->
        <path d="M450,220 Q400,250 400,300" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <circle cx="0" cy="0" r="3" fill="#60A5FA">
            <animateMotion path="M450,220 Q400,250 400,300" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <!-- Results to User -->
        <path d="M200,300 Q120,300 80,220" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <circle cx="0" cy="0" r="3" fill="#60A5FA">
            <animateMotion path="M200,300 Q120,300 80,220" dur="1.5s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg> 