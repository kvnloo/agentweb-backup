services:
  backend:
    build:
      context: ..
      dockerfile: test-env/Dockerfile.backend
    ports:
      - "3001:3001"
    env_file:
      - ../.env.test-env
    environment:
      - PORT=3001
      - NODE_ENV=development
      - FRONTEND_URL=http://${PUBLIC_IP}:5173
      - CUSTOMER_FRONTEND_URL=http://${PUBLIC_IP}:5174
      - BACKEND_URL=http://${PUBLIC_IP}:3001
    restart: unless-stopped

  partner-portal:
    build:
      context: ..
      dockerfile: test-env/Dockerfile.partner-portal
      args:
        VITE_API_URL: http://${PUBLIC_IP}:3001
        VITE_CUSTOMER_FRONTEND_URL: http://${PUBLIC_IP}:5174
        VITE_DEBUG: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  customer-portal:
    build:
      context: ..
      dockerfile: test-env/Dockerfile.customer-portal
      args:
        VITE_API_URL: http://${PUBLIC_IP}:3001
        VITE_DEBUG: "true"
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped
