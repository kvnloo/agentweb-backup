services:
  backend:
    build:
      context: ..
      dockerfile: test-env/Dockerfile.backend
    ports:
      - "3001:3001"
    env_file:
      - ../.env.test-env
    environment:
      - PORT=3001
      - NODE_ENV=development
      - FRONTEND_URL=http://${PUBLIC_IP}:5173
      - CUSTOMER_FRONTEND_URL=http://${PUBLIC_IP}:5174
      # BACKEND_URL is intentionally omitted here — read from .env.test-env (contains the ngrok HTTPS URL)
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http backend:3001
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - backend
    restart: unless-stopped

  partner-portal:
    build:
      context: ..
      dockerfile: test-env/Dockerfile.partner-portal
      args:
        VITE_API_URL: http://${PUBLIC_IP}:3001
        VITE_CUSTOMER_FRONTEND_URL: http://${PUBLIC_IP}:5174
        VITE_DEBUG: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  customer-portal:
    build:
      context: ..
      dockerfile: test-env/Dockerfile.customer-portal
      args:
        VITE_API_URL: http://${PUBLIC_IP}:3001
        VITE_DEBUG: "true"
    ports:
      - "5174:5174"
    environment:
      - API_URL=http://backend:3001
      - BROWSER_API_URL=http://${PUBLIC_IP}:3001
    depends_on:
      - backend
    restart: unless-stopped

  test-env-access:
    build:
      context: ..
      dockerfile: test-env/Dockerfile.test-env-access
    ports:
      - "5175:5175"
    env_file:
      - ../.env.test-env-access
    environment:
      - PORT=5175
      - SG_ID=${SG_ID}
      - AWS_REGION=${AWS_REGION:-us-west-2}
    volumes:
      - test-env-access-data:/app/data
    restart: unless-stopped

volumes:
  test-env-access-data:
