name: AgentWeb z0 Outcome Coverage Gate E2E

on:
  pull_request:
    branches: [lab/z0-outcome-observations-v1]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-gate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AgentWeb exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout z0intelligence coverage branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kvnloo/z0intelligence
          ref: lab/agentweb-outcome-coverage-gate-v1
          path: deps/z0intelligence
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record exact heads
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          roots = {
              "agentweb": ".",
              "z0intelligence": "deps/z0intelligence",
          }
          heads = {
              name: subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()
              for name, path in roots.items()
          }
          Path("/tmp/z0-outcome-coverage-heads.json").write_text(
              json.dumps(heads, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(heads, indent=2))
          PY

      - name: Install narrow dependencies
        run: |
          cd backend && npm ci
          cd ..
          python -m pip install pytest==8.4.2 typesafe-sdk==0.7.2

      - name: Run coverage gate unit suites
        run: |
          cd backend
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit \
            src/__tests__/experiments.z0OutcomeCoverage.test.ts \
            src/__tests__/experiments.z0OutcomeObservation.test.ts
          cd ..
          PYTHONPATH="$GITHUB_WORKSPACE/deps/z0intelligence/src" python -m pytest -q \
            deps/z0intelligence/tests/test_outcome_coverage.py \
            deps/z0intelligence/tests/test_outcome_observation.py

      - name: Start z0intelligence with compact E2E gate thresholds
        env:
          PYTHONPATH: ${{ github.workspace }}/deps/z0intelligence/src
          Z0INT_HOME: /tmp/z0int-outcome-coverage-home
          Z0INT_AGENTWEB_OUTCOME_MIN_ELIGIBLE_PER_WINDOW: "2"
          Z0INT_AGENTWEB_OUTCOME_MIN_COVERAGE: "1.0"
          Z0INT_AGENTWEB_OUTCOME_MIN_COMPLETE_COVERAGE: "1.0"
        run: |
          mkdir -p "$Z0INT_HOME"
          python -m z0int.intelligence_service --port 11501 > /tmp/z0int-outcome-coverage.log 2>&1 &
          echo $! > /tmp/z0int-outcome-coverage.pid
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:11501/healthz"
          last = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(.25)
          raise SystemExit(f"z0intelligence did not become ready: {last}")
          PY

      - name: Run AgentWeb expectation + coverage study
        working-directory: backend
        env:
          Z0INT_SERVICE_URL: http://127.0.0.1:11501
        run: |
          npx ts-node src/scripts/run-z0-outcome-coverage-study.ts \
            /tmp/z0-outcome-coverage-study.json
          cat /tmp/z0-outcome-coverage-study.json

      - name: Verify append-only registry and gate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.load(open("/tmp/z0-outcome-coverage-study.json"))
          assert result["blockedEligible"] is False
          assert result["passedEligible"] is True
          assert result["blocked"]["by_window"]["7d"]["coverage"] == 0.5
          assert result["passed"]["by_window"]["7d"]["coverage"] == 1.0
          assert result["passed"]["promotion_gate"]["necessary_not_sufficient"] is True
          assert result["passed"]["promotion_gate"]["causal_quality_proven"] is False

          root = Path("/tmp/z0int-outcome-coverage-home/receipts")
          expectations = [
              json.loads(line)
              for line in (root / "agentweb_outcome_expectations.jsonl").read_text().splitlines()
              if line.strip()
          ]
          observations = [
              json.loads(line)
              for line in (root / "agentweb_outcome_observations.jsonl").read_text().splitlines()
              if line.strip()
          ]
          assert len(expectations) == 2, expectations
          assert len(observations) == 6, observations
          assert all(row["quality_authoritative"] is False for row in expectations)
          assert all(row["quality_authoritative"] is False for row in observations)
          assert all("raw-customer-" not in json.dumps(row) for row in expectations)
          assert all("raw-customer-" not in json.dumps(row) for row in observations)
          PY

      - name: Stop z0intelligence
        if: always()
        run: |
          if test -f /tmp/z0int-outcome-coverage.pid; then
            kill "$(cat /tmp/z0int-outcome-coverage.pid)" || true
          fi
          cat /tmp/z0int-outcome-coverage.log || true

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentweb-z0-outcome-coverage-gate-e2e
          path: |
            /tmp/z0-outcome-coverage-heads.json
            /tmp/z0-outcome-coverage-study.json
            /tmp/z0int-outcome-coverage-home/receipts/agentweb_outcome_expectations.jsonl
            /tmp/z0int-outcome-coverage-home/receipts/agentweb_outcome_observations.jsonl
            /tmp/z0int-outcome-coverage.log
