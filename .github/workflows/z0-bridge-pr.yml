name: z0 bridge PR

on:
  pull_request:
    branches:
      - lab/upstream-20261001

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx jest --runInBand src/__tests__/z0BridgeContract.test.ts src/__tests__/z0RouteShadow.test.ts --forceExit
