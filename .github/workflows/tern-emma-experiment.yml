name: Tern Emma Experiment

on:
  push:
    branches:
      - experiment/tern-emma-p0
      - tern/native-operator

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Production build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Tern focused regressions
        working-directory: backend
        run: |
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit             src/__tests__/tern.protocol.test.ts             src/__tests__/tern.textEdit.test.ts             src/__tests__/tern.reconcile.test.ts             src/__tests__/tern.renderEmma.test.ts             src/__tests__/tern.agentWebClient.test.ts
