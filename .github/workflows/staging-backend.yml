name: Deploy backend to staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Repository git ref or full SHA to deploy to staging'
        required: true
        type: string

# Reuse the former staging lane; refs must never deploy concurrently.
concurrency:
  group: backend-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  build:
    # Build caller-selected source without an environment, secrets, or AWS credentials.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version_label: ${{ steps.version.outputs.version_label }}
    steps:
      - name: Validate explicit ref
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_REF//[[:space:]]/}" ]]; then
            echo "::error::An explicit deployment ref or SHA is required."
            exit 1
          fi

      - name: Checkout deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false

      - name: Record deployment identity
        id: version
        run: |
          set -euo pipefail
          SHA="$(git -C source rev-parse HEAD)"
          VERSION_LABEL="backend-staging-${SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          printf 'Staging backend SHA: %s\nApplication version: %s\n' "$SHA" "$VERSION_LABEL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/backend/package-lock.json

      - name: Build and package
        working-directory: source/backend
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          npm ci
          NODE_OPTIONS="--max-old-space-size=4096" npm run build
          cp ../test-env/user-data-dev-auto.sh dist/
          for entry in .platform .ebextensions; do
            [[ -d "$entry" ]] || { echo "::error::Missing bundle directory: ${entry}"; exit 1; }
          done
          mkdir -p builds
          zip -r "builds/${VERSION_LABEL}.zip" dist docs package.json package-lock.json .env.example .platform .ebextensions

      - name: Transfer deployment package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-staging-bundle
          path: source/backend/builds/${{ steps.version.outputs.version_label }}.zip
          if-no-files-found: error
          retention-days: 1

  backend-staging-deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: staging
    env:
      EB_APPLICATION_NAME: ${{ vars.EB_BACKEND_STAGING_APPLICATION_NAME }}
      EB_ENVIRONMENT_NAME: ${{ vars.EB_BACKEND_STAGING_ENVIRONMENT_NAME }}
    steps:
      - name: Checkout deploy controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download deployment package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-staging-bundle
          path: builds

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deployment package
        env:
          VERSION_LABEL: ${{ needs.build.outputs.version_label }}
        run: |
          set -euo pipefail
          aws s3 cp "builds/${VERSION_LABEL}.zip" \
            "s3://elasticbeanstalk-${AWS_REGION}-992382574572/builds/${VERSION_LABEL}.zip"

      - name: Deploy and verify
        timeout-minutes: 50
        env:
          EB_VERSION_LABEL: ${{ needs.build.outputs.version_label }}
          EB_SOURCE_BUNDLE_S3_BUCKET: elasticbeanstalk-${{ env.AWS_REGION }}-992382574572
          EB_SOURCE_BUNDLE_S3_KEY: builds/${{ needs.build.outputs.version_label }}.zip
          EB_TOTAL_TIMEOUT_SECONDS: '2700'
          EB_SETTLE_TIMEOUT_SECONDS: '1200'
          # ENG-1749: apply the same 600s deregistration delay ENG-823 proved
          # on prod. ensure_deregistration_delay() in eb-deploy.sh is a no-op
          # unless this var is set, so staging previously deployed at the AWS
          # default of 20s on target group 6c60f9c83d4b64e9.
          EB_DEREGISTRATION_DELAY_SECONDS: '600'
        run: bash .github/scripts/eb-deploy.sh

      # The shared script retains its bounded recovery logic. Staging evidence
      # additionally requires a literal Green rollup on the exact new version.
      - name: Confirm staging Ready and Green
        env:
          EB_VERSION_LABEL: ${{ needs.build.outputs.version_label }}
        run: |
          set -euo pipefail
          EXPECTED="$(printf 'Ready\tGreen\t%s' "$EB_VERSION_LABEL")"
          DEADLINE=$(( SECONDS + ${STAGING_GREEN_TIMEOUT_SECONDS:-600} ))
          while :; do
            STATE="$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --query 'Environments[0].[Status,Health,VersionLabel]' --output text)"
            [[ "$STATE" == "$EXPECTED" ]] && break
            if (( SECONDS >= DEADLINE )); then
              echo "::error::Staging verification failed: ${STATE}"
              exit 1
            fi
            echo "Waiting for Ready/Green on ${EB_VERSION_LABEL}; observed: ${STATE}"
            sleep 20
          done
          printf 'Verified staging %s: %s\n' "$EB_ENVIRONMENT_NAME" "$STATE" | tee -a "$GITHUB_STEP_SUMMARY"
