name: AgentWeb z0 Outcome Observation E2E

on:
  pull_request:
    branches: [lab/z0-bridge-nontransitive-secrets-v1]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AgentWeb exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout z0intelligence outcome branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kvnloo/z0intelligence
          ref: lab/agentweb-outcome-observations-v1
          path: deps/z0intelligence
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record exact heads
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          roots = {
              "agentweb": ".",
              "z0intelligence": "deps/z0intelligence",
          }
          heads = {
              name: subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()
              for name, path in roots.items()
          }
          Path("/tmp/z0-outcome-heads.json").write_text(
              json.dumps(heads, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(heads, indent=2))
          PY

      - name: Install narrow dependencies
        run: |
          cd backend && npm ci
          cd ..
          python -m pip install pytest==8.4.2 typesafe-sdk==0.7.2

      - name: Run outcome unit suites
        run: |
          cd backend
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit \
            src/__tests__/experiments.z0OutcomeObservation.test.ts
          cd ..
          PYTHONPATH="$GITHUB_WORKSPACE/deps/z0intelligence/src" python -m pytest -q \
            deps/z0intelligence/tests/test_outcome_observation.py

      - name: Start z0intelligence
        env:
          PYTHONPATH: ${{ github.workspace }}/deps/z0intelligence/src
          Z0INT_HOME: /tmp/z0int-outcome-home
        run: |
          mkdir -p "$Z0INT_HOME"
          python -m z0int.intelligence_service --port 11501 > /tmp/z0int-outcome.log 2>&1 &
          echo $! > /tmp/z0int-outcome.pid
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:11501/healthz"
          last = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(.25)
          raise SystemExit(f"z0intelligence did not become ready: {last}")
          PY

      - name: Run AgentWeb outcome observation study
        working-directory: backend
        env:
          Z0INT_SERVICE_URL: http://127.0.0.1:11501
        run: |
          npx ts-node src/scripts/run-z0-outcome-observation-study.ts \
            /tmp/z0-outcome-observation-study.json
          cat /tmp/z0-outcome-observation-study.json

      - name: Verify immutable append-only outcome evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.load(open("/tmp/z0-outcome-observation-study.json"))
          projected = result["projected_1h"]
          assert projected["quality_authoritative"] is False
          assert projected["subject_ref"].startswith("agentweb-subject:")
          assert "raw-customer-fixture" not in json.dumps(projected)

          assert result["first"]["reason"] == "stored"
          assert result["replay"]["reason"] == "replayed"
          assert result["mutation"]["reason"] == "http_400"
          assert result["day"]["reason"] == "stored"
          assert result["week"]["reason"] == "stored"

          path = Path(
              "/tmp/z0int-outcome-home/receipts/agentweb_outcome_observations.jsonl"
          )
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert len(rows) == 3, rows
          assert {row["window"] for row in rows} == {"1h", "24h", "7d"}
          assert all(row["schema"] == "z0int.agentweb_outcome_observation.v1" for row in rows)
          assert all(row["quality_authoritative"] is False for row in rows)
          assert all(row["observational"] is True for row in rows)
          assert len({row["observation_id"] for row in rows}) == 3
          assert all("raw-customer-fixture" not in json.dumps(row) for row in rows)
          PY

      - name: Stop z0intelligence
        if: always()
        run: |
          if test -f /tmp/z0int-outcome.pid; then
            kill "$(cat /tmp/z0int-outcome.pid)" || true
          fi
          cat /tmp/z0int-outcome.log || true

      - name: Upload outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentweb-z0-outcome-observation-e2e
          path: |
            /tmp/z0-outcome-heads.json
            /tmp/z0-outcome-observation-study.json
            /tmp/z0int-outcome-home/receipts/agentweb_outcome_observations.jsonl
            /tmp/z0int-outcome.log
