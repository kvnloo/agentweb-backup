name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
  schedule:
    # Run at 2:00 AM UTC (6:00 PM PST) every day
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  AWS_REGION: 'us-west-2'

jobs:
  detect-changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.manual.outputs.backend }}
      partner: ${{ steps.filter.outputs.partner || steps.manual.outputs.partner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Check changes (scheduled)
        if: github.event_name == 'schedule'
        id: filter
        run: |
          BASE=$(git rev-parse HEAD~10 2>/dev/null || git rev-list --max-parents=0 HEAD)
          BACKEND=$(git diff --name-only "$BASE" HEAD -- backend/ | head -1)
          PARTNER=$(git diff --name-only "$BASE" HEAD -- partner-portal/ | head -1)
          echo "backend=$( [ -n \"$BACKEND\" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "partner=$( [ -n \"$PARTNER\" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Deploy all (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          echo "backend=true" >> $GITHUB_OUTPUT
          echo "partner=true" >> $GITHUB_OUTPUT


  backend-deploy:
    name: Backend deploy to production
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Resolve deployment label suffix
        id: pr-num
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" == "schedule" ]; then
            SUFFIX="scheduled-${SHORT_SHA}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SUFFIX="manual-${SHORT_SHA}"
          else
            PR_NUM=$(git log -1 --pretty=%s | grep -oP '#\K[0-9]+' || echo "${SHORT_SHA}")
            SUFFIX="${PR_NUM}"
          fi
          echo "pr_num=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Copy dev env user-data script into dist
        working-directory: backend
        run: cp ../test-env/user-data-dev-auto.sh dist/

      - name: Package artifact
        working-directory: backend
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUM=${{ steps.pr-num.outputs.pr_num }}
          mkdir -p builds
          zip -r "builds/backend-${DATE}-pr${PR_NUM}.zip" dist docs package.json package-lock.json .env.example .platform .ebextensions || zip -r "builds/backend-${DATE}-pr${PR_NUM}.zip" dist docs package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        timeout-minutes: 5
        working-directory: backend
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUM=${{ steps.pr-num.outputs.pr_num }}
          VERSION_LABEL="backend-${DATE}-pr${PR_NUM}"
          echo "Deploying backend: $VERSION_LABEL"

          # Upload to S3
          echo "Uploading deployment package to S3..."
          aws s3 cp "builds/backend-${DATE}-pr${PR_NUM}.zip" "s3://elasticbeanstalk-${{ env.AWS_REGION }}-992382574572/builds/${VERSION_LABEL}.zip"

          # Create new application version
          echo "Creating new application version..."
          aws elasticbeanstalk create-application-version \
            --application-name ${{ vars.EB_BACKEND_APPLICATION_NAME }} \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="elasticbeanstalk-${{ env.AWS_REGION }}-992382574572,S3Key=builds/${VERSION_LABEL}.zip" || echo "⚠️  Version creation failed (may already exist), continuing..."

          # Deploy to environment
          echo "Deploying to environment..."
          aws elasticbeanstalk update-environment \
            --environment-name ${{ vars.EB_BACKEND_ENVIRONMENT_NAME }} \
            --version-label "$VERSION_LABEL" || echo "⚠️  Environment update failed (may be updating), but AWS deployment likely succeeded"

      - name: Backend Deployment Status
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUM=${{ steps.pr-num.outputs.pr_num }}
          echo "🚀 Backend deployment initiated successfully!"
          echo "📊 Check deployment status: https://${{ env.AWS_REGION }}.console.aws.amazon.com/elasticbeanstalk/home?region=${{ env.AWS_REGION }}#/environments"
          echo "✅ Deployed: backend-${DATE}-pr${PR_NUM}"

      # Artifact upload removed to save GitHub storage quota
      # Build artifacts are already uploaded to S3 for deployment

  partner-deploy:
    name: Partner portal deploy to production
    needs: detect-changes
    if: needs.detect-changes.outputs.partner == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: partner-portal/package-lock.json

      - name: Resolve deployment label suffix
        id: pr-num
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" == "schedule" ]; then
            SUFFIX="scheduled-${SHORT_SHA}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SUFFIX="manual-${SHORT_SHA}"
          else
            PR_NUM=$(git log -1 --pretty=%s | grep -oP '#\K[0-9]+' || echo "${SHORT_SHA}")
            SUFFIX="${PR_NUM}"
          fi
          echo "pr_num=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: partner-portal
        run: npm ci

      - name: Build
        working-directory: partner-portal
        env:
          VITE_API_URL: 'https://api.agentweb.pro'
          VITE_CUSTOMER_FRONTEND_URL: 'https://app.agentweb.pro'
          VITE_DEBUG: 'false'
          VITE_LIST_FULL_LLM_NAMES: 'azure->openai->gpt-4.1,google->google->gemini-2.5-pro-preview-05-06,azure->openai->gpt-4o,aws->anthropic->anthropic.claude-3-5-sonnet-20241022-v2:0,openai->openai->gpt-4o,aws->anthropic->us.anthropic.claude-3-7-sonnet-20250219-v1:0,google->google->gemini-2.5-flash,google->google->gemini-2.5-flash-lite,azure->openai->gpt-5-chat,google->google->gemini-2.5-pro'
          VITE_DEEP_RESEARCH_LLM_NAMES: 'azure->openai->o1-mini,azure->openai->gpt-4o'
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Package artifact
        working-directory: partner-portal
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUM=${{ steps.pr-num.outputs.pr_num }}
          mkdir -p builds
          zip -r "builds/partner-${DATE}-pr${PR_NUM}.zip" dist package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        timeout-minutes: 5
        working-directory: partner-portal
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUM=${{ steps.pr-num.outputs.pr_num }}
          VERSION_LABEL="partner-${DATE}-pr${PR_NUM}"
          echo "Deploying partner portal: $VERSION_LABEL"

          # Upload to S3
          echo "Uploading deployment package to S3..."
          aws s3 cp "builds/partner-${DATE}-pr${PR_NUM}.zip" "s3://elasticbeanstalk-${{ env.AWS_REGION }}-992382574572/builds/${VERSION_LABEL}.zip"

          # Create new application version
          echo "Creating new application version..."
          aws elasticbeanstalk create-application-version \
            --application-name ${{ vars.EB_PARTNER_APPLICATION_NAME }} \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="elasticbeanstalk-${{ env.AWS_REGION }}-992382574572,S3Key=builds/${VERSION_LABEL}.zip" || echo "⚠️  Version creation failed (may already exist), continuing..."

          # Deploy to environment
          echo "Deploying to environment..."
          aws elasticbeanstalk update-environment \
            --environment-name ${{ vars.EB_PARTNER_ENVIRONMENT_NAME }} \
            --version-label "$VERSION_LABEL" || echo "⚠️  Environment update failed (may be updating), but AWS deployment likely succeeded"

      - name: Partner Portal Deployment Status
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUM=${{ steps.pr-num.outputs.pr_num }}
          echo "🚀 Partner portal deployment initiated successfully!"
          echo "📊 Check deployment status: https://${{ env.AWS_REGION }}.console.aws.amazon.com/elasticbeanstalk/home?region=${{ env.AWS_REGION }}#/environments"
          echo "✅ Deployed: partner-${DATE}-pr${PR_NUM}"

      # Artifact upload removed to save GitHub storage quota
      # Build artifacts are already uploaded to S3 for deployment
