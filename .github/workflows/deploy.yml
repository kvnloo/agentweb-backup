name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
      probe_dryrun:
        # ENG-878: the lagging-rollup health probe only runs when EB's health
        # rollup is still Grey/Red past the settle window, which has not
        # happened since it shipped — so its four extra IAM actions have never
        # executed for real. Setting this exercises the probe on an ordinary
        # healthy deploy and logs what it saw. It cannot change the deploy's
        # verdict; the deploy is already confirmed before it runs.
        description: 'Exercise the EB health probe (observation only, cannot fail the deploy)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: 'us-west-2'

jobs:
  detect-changes:
    name: Detect changed projects
    # ENG-1277: ubuntu-slim ($0.002/min vs $0.006) — a checkout + paths-filter
    # read (or a two-line manual-trigger step), no docker, no build.
    runs-on: ubuntu-slim
    permissions:
      contents: read
      # deploy-base-sha.sh reads prior Deploy runs and their jobs (ENG-2170).
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.manual.outputs.backend || steps.push_fallback.outputs.backend }}
      partner: ${{ steps.filter.outputs.partner || steps.manual.outputs.partner || steps.push_fallback.outputs.partner }}
      # ENG-2677: previous successful deploy head; empty when unresolved or manual.
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ENG-2170: `dorny/paths-filter` with no `base` compares only against
      # `github.event.before` — the one commit immediately preceding this
      # push. That is the wrong base whenever an earlier Deploy run never got
      # to make its own comparison: `concurrency: deploy-production` keeps
      # only one PENDING run, so a merge landing while a deploy is already
      # pending cancels the older pending run before `detect-changes` ever
      # runs. The next run that does execute then only diffs against its own
      # previous commit, so a component change that only existed in the
      # cancelled run's diff is silently never deployed. Resolving the base to
      # the last run that actually completed `detect-changes` closes that gap
      # — see deploy-base-sha.sh for the full reasoning and its fail-safe.
      - name: Resolve base SHA for change detection (push)
        if: github.event_name == 'push'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-base-sha.sh

      - name: Check changes (push)
        if: github.event_name == 'push' && steps.base.outputs.resolved == 'true'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.base_sha }}
          # ENG-1658/ENG-743: what gates a deploy has to gate its own changes.
          # `eb-deploy.sh` IS the deploy — it applies the version and decides
          # whether the environment took it — and `deploy.yml` is what runs it,
          # so a change to either is a change to the deploy. With `backend/**`
          # alone neither triggered one: 21 commits touched these two files in
          # the 34 days to 2026-08-31 and not one of them deployed. Each first
          # executed on some later, unrelated PR, which is where a mistake in it
          # would surface and be attributed. The ENG-878 chain is what that
          # costs — five commits, three of them same-day fixes to the one
          # before.
          #
          # Both filters list both paths on purpose. `partner-deploy` runs the
          # same script under its own budgets, so the rule is uniform rather
          # than backend-only; partner deploys take ~2 min. tests.yml has
          # carried `.github/scripts/eb-deploy.sh` in its own backend filter
          # since ENG-743 — deploy.yml was the outlier.
          #
          # Measured cost: +21 backend deploys per 34 days on a baseline of
          # ~9.5/day (+6.5%), with 88 of the last 88 green.
          #
          # paths-filter-hygiene.test.sh asserts this both ways, so the gap
          # cannot reopen quietly.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
              - '.github/scripts/eb-deploy.sh'
            partner:
              - 'partner-portal/**'
              - '.github/workflows/deploy.yml'
              - '.github/scripts/eb-deploy.sh'

      # deploy-base-sha.sh could not name a trustworthy base (no completed
      # prior run, or the GitHub API was unreachable). Deploying both
      # components unconditionally is the fail-safe: a redundant deploy is
      # cheap and idempotent, whereas guessing a base and getting it wrong
      # reproduces the exact silent-skip this exists to close (ENG-2170).
      - name: Deploy all (push, base unresolved)
        if: github.event_name == 'push' && steps.base.outputs.resolved != 'true'
        id: push_fallback
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "partner=true" >> "$GITHUB_OUTPUT"

      - name: Deploy all (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "partner=true" >> "$GITHUB_OUTPUT"

  backend-deploy:
    name: Backend deploy to production
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      # Resolved once and reused by every later step. Previously the date and PR
      # suffix were recomputed in three places, so a run crossing midnight could
      # upload one label and deploy another.
      - name: Resolve deployment version label
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SUFFIX="manual-${SHORT_SHA}"
          else
            # Take the first `#123` in the merge commit subject. Matching in the
            # shell (rather than `grep -oP`) keeps a subject containing several
            # `#` references from producing a multi-line label that EB rejects.
            SUBJECT="$(git log -1 --pretty=%s)"
            if [[ "$SUBJECT" =~ \#([0-9]+) ]]; then
              SUFFIX="${BASH_REMATCH[1]}"
            else
              SUFFIX="${SHORT_SHA}"
            fi
          fi
          VERSION_LABEL="backend-$(date +%Y%m%d)-pr${SUFFIX}"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "Resolved deployment version label: ${VERSION_LABEL}"

      - name: Copy dev env user-data script into dist
        working-directory: backend
        run: cp ../test-env/user-data-dev-auto.sh dist/

      # Written INTO dist, immediately before the zip, so the file travels inside the artifact and
      # describes the code beside it. Anywhere outside dist would be a claim about a build rather
      # than a property of one. /health then reports the label (see backend/src/utils/buildInfo.ts),
      # which is what makes "the workflow succeeded" and "this instance is serving that code" two
      # separately checkable statements.
      - name: Record the build in dist/build-info.json
        working-directory: backend
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          printf '{"versionLabel":"%s","commit":"%s","builtAt":"%s"}\n' \
            "$VERSION_LABEL" "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/build-info.json
          cat dist/build-info.json

      - name: Package artifact
        working-directory: backend
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          mkdir -p builds
          zip -r "builds/${VERSION_LABEL}.zip" dist docs package.json package-lock.json .env.example .platform .ebextensions || zip -r "builds/${VERSION_LABEL}.zip" dist docs package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deployment package to S3
        working-directory: backend
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          aws s3 cp "builds/${VERSION_LABEL}.zip" \
            "s3://elasticbeanstalk-${{ env.AWS_REGION }}-992382574572/builds/${VERSION_LABEL}.zip"

      # Creates the application version, applies it, and then proves the
      # environment actually came up on it. Every AWS failure fails this step —
      # see .github/scripts/eb-deploy.sh (ENG-734).
      - name: Deploy to Elastic Beanstalk and verify the environment took it
        timeout-minutes: 50
        env:
          EB_APPLICATION_NAME: ${{ vars.EB_BACKEND_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_BACKEND_ENVIRONMENT_NAME }}
          EB_VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          EB_SOURCE_BUNDLE_S3_BUCKET: elasticbeanstalk-${{ env.AWS_REGION }}-992382574572
          EB_SOURCE_BUNDLE_S3_KEY: builds/${{ steps.version.outputs.version_label }}.zip
          EB_TOTAL_TIMEOUT_SECONDS: '2700'
          # ENG-1183: the settle cap is how long we wait for an update that was
          # already running when we arrived. eb-deploy.sh defaults it to 600s,
          # a Rolling-era number: back then an environment freed up in 3-5 min.
          # This environment has been Immutable since 2026-07-01
          # (backend/.ebextensions/rolling.config), which launches a parallel
          # fleet, health-checks it, swaps, then drains the old one. Measured
          # over 24 consecutive production deploys: median ~535s, max 1352s.
          # An update in flight for longer than 600s is therefore normal, and
          # on expiry the script does not shrug and proceed — it fails the
          # deploy with "Version was NOT applied".
          #
          # Nothing in GitHub Actions can start such an update (deploy.yml is
          # serialised by `concurrency: deploy-production`), but EB can and
          # does: 05-instance-recycling.config enables managed platform updates
          # with InstanceRefreshEnabled every Sun 10:00 UTC. A deploy landing
          # in that window is failed today for an environment that is healthy.
          #
          # 1200s is bounded on both sides, and eb-deploy.test.sh asserts both:
          #   floor   >= 900s, the EB command Timeout in rolling.config. Giving
          #           up before EB's own timeout means failing a deploy while
          #           EB still considers the in-flight command live.
          #   ceiling  2700 - 1200 = 1500s left to run our own deploy, above
          #           the 1352s worst case measured above.
          EB_SETTLE_TIMEOUT_SECONDS: '1200'
          # '1' only on a manual run that asked for it (ENG-878).
          EB_HEALTH_PROBE_DRYRUN: ${{ inputs.probe_dryrun && '1' || '0' }}
          # ENG-823: `.ebextensions` silently failed to apply this twice, so
          # it is set directly against the live target group instead — see
          # ensure_deregistration_delay() in eb-deploy.sh.
          EB_DEREGISTRATION_DELAY_SECONDS: '600'
        run: bash .github/scripts/eb-deploy.sh

      - name: Backend Deployment Status
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          echo "Backend deployment complete and verified."
          echo "Deployed: ${VERSION_LABEL}"

      # Artifact upload removed to save GitHub storage quota
      # Build artifacts are already uploaded to S3 for deployment

  partner-deploy:
    name: Partner portal deploy to production
    needs: detect-changes
    if: needs.detect-changes.outputs.partner == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'npm'
          cache-dependency-path: partner-portal/package-lock.json

      # Resolved once and reused by every later step — see the backend job.
      - name: Resolve deployment version label
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SUFFIX="manual-${SHORT_SHA}"
          else
            # Take the first `#123` in the merge commit subject. Matching in the
            # shell (rather than `grep -oP`) keeps a subject containing several
            # `#` references from producing a multi-line label that EB rejects.
            SUBJECT="$(git log -1 --pretty=%s)"
            if [[ "$SUBJECT" =~ \#([0-9]+) ]]; then
              SUFFIX="${BASH_REMATCH[1]}"
            else
              SUFFIX="${SHORT_SHA}"
            fi
          fi
          VERSION_LABEL="partner-$(date +%Y%m%d)-pr${SUFFIX}"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "Resolved deployment version label: ${VERSION_LABEL}"

      - name: Install dependencies
        working-directory: partner-portal
        run: npm ci

      - name: Build
        working-directory: partner-portal
        env:
          VITE_API_URL: 'https://api.agentweb.pro'
          VITE_CUSTOMER_FRONTEND_URL: 'https://app.agentweb.pro'
          VITE_DEBUG: 'false'
          VITE_LIST_FULL_LLM_NAMES: 'azure->openai->gpt-4.1,google->google->gemini-2.5-pro-preview-05-06,azure->openai->gpt-4o,aws->anthropic->anthropic.claude-3-5-sonnet-20241022-v2:0,openai->openai->gpt-4o,aws->anthropic->us.anthropic.claude-3-7-sonnet-20250219-v1:0,google->google->gemini-2.5-flash,google->google->gemini-2.5-flash-lite,azure->openai->gpt-5-chat,google->google->gemini-2.5-pro'
          VITE_DEEP_RESEARCH_LLM_NAMES: 'azure->openai->o1-mini,azure->openai->gpt-4o'
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Package artifact
        working-directory: partner-portal
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          mkdir -p builds
          zip -r "builds/${VERSION_LABEL}.zip" dist package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deployment package to S3
        working-directory: partner-portal
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          aws s3 cp "builds/${VERSION_LABEL}.zip" \
            "s3://elasticbeanstalk-${{ env.AWS_REGION }}-992382574572/builds/${VERSION_LABEL}.zip"

      # Creates the application version, applies it, and then proves the
      # environment actually came up on it. Every AWS failure fails this step —
      # see .github/scripts/eb-deploy.sh (ENG-734).
      - name: Deploy to Elastic Beanstalk and verify the environment took it
        timeout-minutes: 30
        env:
          EB_APPLICATION_NAME: ${{ vars.EB_PARTNER_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_PARTNER_ENVIRONMENT_NAME }}
          EB_VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          EB_SOURCE_BUNDLE_S3_BUCKET: elasticbeanstalk-${{ env.AWS_REGION }}-992382574572
          EB_SOURCE_BUNDLE_S3_KEY: builds/${{ steps.version.outputs.version_label }}.zip
          EB_TOTAL_TIMEOUT_SECONDS: '1500'
        run: bash .github/scripts/eb-deploy.sh

      - name: Partner Portal Deployment Status
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          echo "Partner portal deployment complete and verified."
          echo "Deployed: ${VERSION_LABEL}"

      # Artifact upload removed to save GitHub storage quota
      # Build artifacts are already uploaded to S3 for deployment

  # ENG-2677 (ENG-2634): announce a SUCCESSFUL backend deploy in #feature-launches
  # with the PRs shipped since the previous successful deploy. Own job, runs only
  # after backend-deploy succeeded, nothing needs it: it cannot gate, alter or roll
  # back the deploy. Channel comes from the FEATURE_LAUNCHES_CHANNEL repo variable;
  # unset -> the script logs a notice and exits 0. Slack ok:false fails THIS job only.
  notify-feature-launch:
    name: Announce production deploy in #feature-launches
    needs: [detect-changes, backend-deploy]
    if: ${{ !cancelled() && needs.backend-deploy.result == 'success' }}
    runs-on: ubuntu-latest
    # The step still fails red on Slack ok:false, but the RUN conclusion stays the
    # deploy's: trunk-deploy-state.sh reads run conclusion as deploy evidence.
    continue-on-error: true
    # AWS keys are prod environment secrets (see notify-deploy-failure).
    environment: prod
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        if: ${{ vars.FEATURE_LAUNCHES_CHANNEL != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # PR titles are fetched inside the script and handled only as jq data;
      # nothing user-controlled is interpolated into `run:`.
      - name: Post shipped PRs to #feature-launches
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_SECRET_ID: prod/AgentWeb/Slack
          FEATURE_LAUNCHES_CHANNEL: ${{ vars.FEATURE_LAUNCHES_CHANNEL }}
          BASE_SHA: ${{ needs.detect-changes.outputs.base_sha }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/deploy-launch-notify.sh

  # A failed production deploy used to be silent. eb-deploy.sh (ENG-734/837)
  # made the run go red honestly, but a red check in the Actions tab is not a
  # notification: on 2026-08-01 nobody saw it and production stayed undeployable
  # for ~17 hours. This job is the alarm (ENG-865).
  #
  # A separate job rather than an `if: failure()` step, for three reasons:
  #   * one implementation covers both deploy jobs;
  #   * it still runs when a deploy job is killed by its own `timeout-minutes`
  #     or cancelled, which a step-level `if: failure()` does not reliably catch;
  #   * if the alert itself breaks, it is a distinct red job in the run rather
  #     than a second red step inside an already-red job that nobody reads.
  #
  # The condition fires ONLY on a job that actually ran and concluded badly.
  # `skipped` — the path filter not selecting that project, which is the common
  # case on any merge touching neither backend/** nor partner-portal/** —
  # matches neither 'failure' nor 'cancelled', so an ordinary docs-only merge
  # posts nothing. A fully successful deploy leaves this job skipped. That noise
  # budget is the whole game: an alert that cries wolf gets muted.
  notify-deploy-failure:
    name: Alert on production deploy failure
    needs: [detect-changes, backend-deploy, partner-deploy]
    # Fires ONLY when a deploy that was actually attempted did not succeed.
    #
    # Deliberately NOT included, because each would cry wolf and a muted alert
    # is worth the same as no alert:
    #
    #   - `detect-changes` failing or being cancelled. That job only computes
    #     path filters; it deploys nothing. Firing "Production deploy FAILED —
    #     do not assume this commit is live" for it states something false.
    #     Its failure means the run could not decide what to deploy, which is a
    #     CI problem, not a production one.
    #   - `cancelled()` on the run as a whole. `always()` still runs a job after
    #     someone presses Cancel, so including cancellation pages a human for
    #     something a human just did on purpose.
    #   - `skipped`. A path-filtered skip is the normal state for any PR that
    #     touches no deployable code — including this one. Verified against real
    #     run 30823838490 (#2254), where both deploy jobs were `skipped` and the
    #     run still concluded success.
    #
    # `cancelled` IS included, but only inside the `!cancelled()` guard, and the
    # distinction is the whole point:
    #   - a human cancels the RUN      -> !cancelled() is false -> silent. Right:
    #     they know, and paging them for their own action is how alerts get muted.
    #   - a deploy JOB is cancelled on its own (runner death, job-level timeout,
    #     an admin cancelling one job) while the run lives -> !cancelled() is
    #     true -> ALERT. That is a real deploy that did not happen, and dropping
    #     it was a silent hole.
    if: >-
      ${{ !cancelled() && (
      needs.backend-deploy.result == 'failure' ||
      needs.backend-deploy.result == 'cancelled' ||
      needs.partner-deploy.result == 'failure' ||
      needs.partner-deploy.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # REQUIRED, not decoration: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY exist
    # only as `prod` ENVIRONMENT secrets — this repo has no repository-level
    # secrets at all. Without this line they resolve to empty strings and the
    # Secrets Manager read fails. `prod` carries no protection rules today; if a
    # required reviewer is ever added to it, this alert would sit pending
    # forever instead of firing, so that rule change has to come with a
    # different credential source for this job.
    environment: prod
    permissions:
      contents: read
      # The classified reason is recovered from the failing job's `::error::`
      # annotation: `actions: read` lists the run's jobs, `checks: read` reads
      # their annotations. See .github/scripts/deploy-failure-alert.sh for why
      # the annotation is the only durable carrier of that reason.
      actions: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # No `continue-on-error`. A missing/malformed/revoked secret, or a Slack
      # `ok:false`, fails this step loudly — an alerting path that quietly stops
      # working is worse than none, because it is trusted.
      - name: Post the deploy-failure alert to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_SECRET_ID: prod/AgentWeb/Slack
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          # Null on a workflow_dispatch run; the script tolerates an empty value.
          # Passed through `env:` rather than interpolated into `run:` so a
          # commit subject can never become shell.
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          DEPLOY_ACTOR: ${{ github.triggering_actor }}
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          BACKEND_RESULT: ${{ needs.backend-deploy.result }}
          PARTNER_RESULT: ${{ needs.partner-deploy.result }}
        run: bash .github/scripts/deploy-failure-alert.sh
