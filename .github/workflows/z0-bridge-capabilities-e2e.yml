name: AgentWeb z0 Bridge Capabilities E2E

on:
  pull_request:
    branches: [lab/z0-bridge-wire-v1]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capabilities-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AgentWeb exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout z0intelligence capability branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kvnloo/z0intelligence
          ref: lab/agentweb-bridge-capabilities-v1
          path: deps/z0intelligence
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record exact heads
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          roots = {
              "agentweb": ".",
              "z0intelligence": "deps/z0intelligence",
          }
          heads = {
              name: subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()
              for name, path in roots.items()
          }
          Path("/tmp/z0-bridge-capability-heads.json").write_text(
              json.dumps(heads, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(heads, indent=2))
          PY

      - name: Install narrow dependencies
        run: |
          cd backend && npm ci
          cd ..
          python -m pip install pytest==8.4.2 typesafe-sdk==0.7.2

      - name: Run capability unit suites
        run: |
          cd backend
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit \
            src/__tests__/experiments.z0BridgeCapabilities.test.ts
          cd ..
          PYTHONPATH="$GITHUB_WORKSPACE/deps/z0intelligence/src" python -m pytest -q \
            deps/z0intelligence/tests/test_agentweb_bridge_capabilities.py \
            deps/z0intelligence/tests/test_agentweb_bridge_protocol.py \
            deps/z0intelligence/tests/test_agentweb_bridge_wire.py

      - name: Start z0intelligence capability service
        env:
          PYTHONPATH: ${{ github.workspace }}/deps/z0intelligence/src
          Z0INT_HOME: /tmp/z0int-capability-home
        run: |
          mkdir -p "$Z0INT_HOME"
          python -m z0int.intelligence_service --port 11501 > /tmp/z0int-capabilities.log 2>&1 &
          echo $! > /tmp/z0int-capabilities.pid
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:11501/healthz"
          last = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(.25)
          raise SystemExit(f"z0intelligence did not become ready: {last}")
          PY

      - name: Negotiate live capabilities from AgentWeb
        working-directory: backend
        env:
          Z0INT_SERVICE_URL: http://127.0.0.1:11501
        run: |
          npx ts-node src/scripts/run-z0-bridge-capabilities-study.ts \
            /tmp/z0-bridge-capabilities.json
          cat /tmp/z0-bridge-capabilities.json

      - name: Verify bounded live document
        run: |
          python - <<'PY'
          import json
          value = json.load(open("/tmp/z0-bridge-capabilities.json"))
          assert value["schema"] == "agentweb.z0.bridge.capabilities.v1"
          assert value["bridge_protocol_versions"] == ["agentweb.z0.bridge.v1"]
          assert value["transport"]["max_request_bytes"] == 40000
          assert value["transport"]["max_active"] == 4
          assert value["transport"]["socket_backlog"] == 8
          encoded = json.dumps(value).lower()
          for forbidden in ("api_key", "access_token", "authorization", "password", "user_id", "session_id"):
              assert forbidden not in encoded, forbidden
          PY

      - name: Stop z0intelligence
        if: always()
        run: |
          if test -f /tmp/z0int-capabilities.pid; then
            kill "$(cat /tmp/z0int-capabilities.pid)" || true
          fi
          cat /tmp/z0int-capabilities.log || true

      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentweb-z0-bridge-capabilities-e2e
          path: |
            /tmp/z0-bridge-capability-heads.json
            /tmp/z0-bridge-capabilities.json
            /tmp/z0int-capabilities.log
