name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: 'us-west-2'

jobs:
  detect-changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    # Per-PR concurrency: a newer commit on the same PR cancels this superseded
    # test job. Group is unique per job so jobs within one run never serialize
    # against each other. The deploy job is deliberately excluded (own lane) so
    # an in-flight staging deploy is never interrupted.
    concurrency:
      group: ${{ github.workflow }}-detect-changes-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      partner: ${{ steps.filter.outputs.partner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            backend:
              - 'backend/**'
            partner:
              - 'partner-portal/**'

  # Job A: heavy agentMode files (~150 files, ~half the test time)
  backend-tests-a:
    name: Backend tests (agentMode)
    needs: detect-changes
    # Skip the heavy suite while the PR is a draft: intermediate pushes to a
    # draft (e.g. the autofix pipeline's re-fix/revise commits) shouldn't burn
    # ~26 runner-min they can't gate a merge with. Flipping the PR to Ready
    # fires `ready_for_review` (see triggers) → one authoritative full run.
    if: needs.detect-changes.outputs.backend == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Distinct group from backend-tests-b so the two still run in parallel; a
    # newer commit on the same PR cancels this job's superseded run.
    concurrency:
      group: ${{ github.workflow }}-backend-tests-a-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Run tests (agentMode files)
        working-directory: backend
        run: >
          npm test --
          --testPathPattern="agentMode"
          --forceExit

  # Job B: everything else + coverage reporting
  backend-tests-b:
    name: Backend tests (all other + coverage)
    needs: detect-changes
    # Same draft gate as backend-tests-a (see above): drafts skip the heavy
    # suite; the run happens once the PR is marked Ready for review.
    if: needs.detect-changes.outputs.backend == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Distinct group from backend-tests-a so the two still run in parallel; a
    # newer commit on the same PR cancels this job's superseded run.
    concurrency:
      group: ${{ github.workflow }}-backend-tests-b-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Run tests with coverage (non-agentMode files)
        working-directory: backend
        run: >
          npm run test:coverage --
          --testPathIgnorePatterns="/node_modules/" "/__tests__/e2e/" "/__tests__/agentMode"
          --coverageThreshold='{}'
          --coverageReporters=text --coverageReporters=json-summary

      - name: Post coverage comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coveragePath = 'backend/coverage/coverage-summary.json';
            if (!fs.existsSync(coveragePath)) {
              console.log('Coverage summary not found, skipping comment');
              return;
            }
            const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const { statements, branches, functions, lines } = coverage.total;
            const allMet = statements.pct >= 95 && branches.pct >= 95 && functions.pct >= 95 && lines.pct >= 95;

            const body = `## 📊 Backend Test Coverage

            | Metric | Coverage | Threshold | Status |
            |--------|----------|-----------|--------|
            | Statements | ${statements.pct}% | 95% | ${statements.pct >= 95 ? '✅' : '❌'} |
            | Branches | ${branches.pct}% | 95% | ${branches.pct >= 95 ? '✅' : '❌'} |
            | Functions | ${functions.pct}% | 95% | ${functions.pct >= 95 ? '✅' : '❌'} |
            | Lines | ${lines.pct}% | 95% | ${lines.pct >= 95 ? '✅' : '❌'} |

            ${allMet ? '✅' : '❌'} **All thresholds must be ≥ 95%**`;

            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const coverageComment = comments.find(c => c.body.includes('📊 Backend Test Coverage'));

            if (coverageComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: coverageComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            if (!allMet) {
              core.setFailed(
                `Backend coverage below 95% threshold: ` +
                `statements=${statements.pct}%, branches=${branches.pct}%, ` +
                `functions=${functions.pct}%, lines=${lines.pct}%`
              );
            }

  greptile-review:
    name: Require Greptile Review
    needs: detect-changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A newer commit on the same PR cancels this superseded Greptile-wait job.
    concurrency:
      group: ${{ github.workflow }}-greptile-review-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Wait for Greptile review check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            check_json="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=Greptile%20Review" --jq '.check_runs[0] // empty')"

            if [ -n "$check_json" ]; then
              status="$(printf '%s' "$check_json" | jq -r '.status')"
              conclusion="$(printf '%s' "$check_json" | jq -r '.conclusion // ""')"
              echo "Greptile Review status=${status} conclusion=${conclusion:-pending} attempt=${attempt}"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "Greptile Review completed with conclusion=${conclusion}"
                exit 1
              fi
            else
              echo "Waiting for Greptile Review check attempt=${attempt}"
            fi

            sleep 20
          done

          echo "Greptile Review did not complete within 20 minutes."
          exit 1

  backend-staging-deploy:
    name: Backend deploy to staging (after tests pass)
    needs: [detect-changes, backend-tests-a, backend-tests-b, greptile-review]
    if: github.event.pull_request.draft == false && needs.detect-changes.outputs.backend == 'true' && needs.backend-tests-a.result == 'success' && needs.backend-tests-b.result == 'success' && needs.greptile-review.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: backend-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Copy dev env user-data script into dist
        working-directory: backend
        run: cp ../test-env/user-data-dev-auto.sh dist/

      - name: Package artifact
        working-directory: backend
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUMBER=${{ github.event.pull_request.number }}
          mkdir -p builds
          zip -r "builds/backend-${DATE}-pr${PR_NUMBER}.zip" dist package.json package-lock.json .env.example .platform .ebextensions || zip -r "builds/backend-${DATE}-pr${PR_NUMBER}.zip" dist package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk (Staging)
        timeout-minutes: 5
        working-directory: backend
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUMBER=${{ github.event.pull_request.number }}
          VERSION_LABEL="backend-${DATE}-pr${PR_NUMBER}"
          echo "Deploying backend to staging: $VERSION_LABEL"

          # Upload to S3
          echo "Uploading deployment package to S3..."
          aws s3 cp "builds/backend-${DATE}-pr${PR_NUMBER}.zip" "s3://elasticbeanstalk-${{ env.AWS_REGION }}-992382574572/builds/${VERSION_LABEL}.zip"

          # Create new application version
          echo "Creating new application version..."
          aws elasticbeanstalk create-application-version \
            --application-name ${{ vars.EB_BACKEND_STAGING_APPLICATION_NAME }} \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="elasticbeanstalk-${{ env.AWS_REGION }}-992382574572,S3Key=builds/${VERSION_LABEL}.zip" || echo "⚠️  Version creation failed (may already exist), continuing..."

          # Deploy to environment
          echo "Deploying to staging environment..."
          aws elasticbeanstalk update-environment \
            --environment-name ${{ vars.EB_BACKEND_STAGING_ENVIRONMENT_NAME }} \
            --version-label "$VERSION_LABEL" || echo "⚠️  Environment update failed (may be updating), but AWS deployment likely succeeded"

      - name: Wait for staging backend readiness
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "${{ vars.EB_BACKEND_STAGING_ENVIRONMENT_NAME }}" \
              --query 'Environments[0].Status' \
              --output text)
            HEALTH=$(aws elasticbeanstalk describe-environments \
              --environment-names "${{ vars.EB_BACKEND_STAGING_ENVIRONMENT_NAME }}" \
              --query 'Environments[0].Health' \
              --output text)
            echo "Staging status=$STATUS health=$HEALTH attempt=$attempt"
            if [ "$STATUS" = "Ready" ] && [ "$HEALTH" != "Grey" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Staging backend did not become ready."
          exit 1

      - name: Backend Staging Deployment Status
        run: |
          DATE=$(date +%Y%m%d)
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "🚀 Backend staging deployment initiated successfully!"
          echo "📊 Check deployment status: https://${{ env.AWS_REGION }}.console.aws.amazon.com/elasticbeanstalk/home?region=${{ env.AWS_REGION }}#/environments"
          echo "✅ Deployed: backend-${DATE}-pr${PR_NUMBER}"
          echo "🔗 Staging URL: https://api-stage.agentweb.pro"

  partner-tests:
    name: Partner portal tests
    needs: detect-changes
    if: needs.detect-changes.outputs.partner == 'true'
    runs-on: ubuntu-latest
    # A newer commit on the same PR cancels this superseded test job.
    concurrency:
      group: ${{ github.workflow }}-partner-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: partner-portal/package-lock.json

      - name: Install dependencies
        working-directory: partner-portal
        run: npm ci

      - name: Build
        working-directory: partner-portal
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Test
        working-directory: partner-portal
        shell: bash
        run: |
          set -euo pipefail
          TEST_SCRIPT=$(jq -r '.scripts.test // ""' package.json)
          if [ -z "$TEST_SCRIPT" ] || [[ "$TEST_SCRIPT" == 'echo "Error: no test specified" && exit 1' ]]; then
            echo "Skipping tests (no real test script)."
            exit 0
          fi
          npm test --silent
