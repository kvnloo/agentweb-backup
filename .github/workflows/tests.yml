name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  # Greptile's verdict lives in a PR comment, which is served by the issues
  # comments endpoint (.github/scripts/greptile-gate.sh).
  issues: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: 'us-west-2'

jobs:
  detect-changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    # Per-PR concurrency: a newer commit on the same PR cancels this superseded
    # test job. Group is unique per job so jobs within one run never serialize
    # against each other. The deploy job is deliberately excluded (own lane) so
    # an in-flight staging deploy is never interrupted.
    concurrency:
      group: ${{ github.workflow }}-detect-changes-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      partner: ${{ steps.filter.outputs.partner }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            backend:
              - 'backend/**'
              # This workflow builds, tests and deploys the backend, and
              # eb-deploy.sh is what decides whether that deploy really
              # happened, so both are part of the backend deploy path. Without
              # these two lines a change to `backend-staging-deploy` can never
              # run on its own PR: the fix ships unexercised, and the first
              # thing to exercise it is somebody else's backend PR. Whatever
              # gates backend merges has to gate its own changes (ENG-743).
              - '.github/workflows/tests.yml'
              - '.github/scripts/eb-deploy.sh'
            partner:
              - 'partner-portal/**'
            workflows:
              - '.github/**'

  # Job A: heavy agentMode files (~150 files, ~half the test time)
  backend-tests-a:
    name: Backend tests (agentMode)
    needs: [detect-changes, greptile-review]
    # Skip the heavy suite while the PR is a draft: intermediate pushes to a
    # draft (e.g. the autofix pipeline's re-fix/revise commits) shouldn't burn
    # ~26 runner-min they can't gate a merge with. Flipping the PR to Ready
    # fires `ready_for_review` (see triggers) → one authoritative full run.
    #
    # ENG-915: and hold it behind the Greptile gate. Both used to fire together
    # on `ready_for_review`, so a review returning below 5/5 burned a complete
    # sharded run whose result the fix-up push invalidated seconds later —
    # measured at 212 of 1424 sampled runner-minutes (15%) over 2026-07-21..08-05,
    # with the gate returning non-success on 15 of 50 completed runs.
    #
    # The second saving is larger and less obvious. 42 of the 96 sampled
    # backend-test jobs ended `cancelled` — 340 runner-minutes, 24% of the
    # total — because a PR averages 6.6 runs and `cancel-in-progress` kills the
    # superseded one only once the next push arrives, by which point the tests
    # have been running for minutes. Waiting on `needs` costs no runner time,
    # so a push landing inside the gate's ~2 min window now cancels these jobs
    # before they have consumed anything. Same six lines, both savings.
    #
    # The cost of serialising is the gate's own runtime, which is ~2 min in
    # practice; the 20 minutes in greptile-gate.sh is its TIMEOUT, not its
    # latency. `backend-staging-deploy` below has been gated this way since
    # ENG-743, so this only extends an existing ordering to the jobs that
    # actually dominate the bill.
    #
    # Accepted tradeoff: a Greptile outage now means no test feedback, not just
    # no merge. It is not a new merge risk — the gate already blocked merges
    # when Greptile was down — and the escape hatch is a one-line revert of
    # this `if`. Deliberately not an `always()`-plus-outputs bypass: that turns
    # a fail-closed gate into one with a conditional pass, which is the shape
    # ENG-754 and ENG-757 both exist to eliminate.
    #
    # This makes a `skipped` here ambiguous — path filter, draft, or a gate that
    # did not pass — so merge-evidence.sh no longer infers the reason. It demands
    # a positive `success` from these two jobs whenever the diff touches the
    # backend paths (ENG-915 acceptance criterion 4). Renaming either job means
    # updating MERGE_EVIDENCE_BACKEND_JOBS there.
    if: needs.detect-changes.outputs.backend == 'true' && github.event.pull_request.draft == false && needs.greptile-review.result == 'success'
    runs-on: ubuntu-latest
    # Distinct group from backend-tests-b so the two still run in parallel; a
    # newer commit on the same PR cancels this job's superseded run.
    concurrency:
      group: ${{ github.workflow }}-backend-tests-a-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Run tests (agentMode files)
        working-directory: backend
        run: >
          npm test --
          --testPathPattern="agentMode"
          --forceExit

  # Job B: everything else + coverage reporting
  backend-tests-b:
    name: Backend tests (all other + coverage)
    needs: [detect-changes, greptile-review]
    # Same draft and Greptile gates as backend-tests-a (see above): drafts skip
    # the heavy suite, and a review below 5/5 stops it before it starts; the run
    # happens once the PR is Ready and the gate has passed on this head.
    if: needs.detect-changes.outputs.backend == 'true' && github.event.pull_request.draft == false && needs.greptile-review.result == 'success'
    runs-on: ubuntu-latest
    # Distinct group from backend-tests-a so the two still run in parallel; a
    # newer commit on the same PR cancels this job's superseded run.
    concurrency:
      group: ${{ github.workflow }}-backend-tests-b-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Run tests with coverage (non-agentMode files)
        working-directory: backend
        run: >
          npm run test:coverage --
          --testPathIgnorePatterns="/node_modules/" "/__tests__/e2e/" "/__tests__/agentMode"
          --coverageThreshold='{}'
          --coverageReporters=text --coverageReporters=json-summary

      - name: Post coverage comment on PR
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const coveragePath = 'backend/coverage/coverage-summary.json';
            if (!fs.existsSync(coveragePath)) {
              console.log('Coverage summary not found, skipping comment');
              return;
            }
            const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const { statements, branches, functions, lines } = coverage.total;
            const allMet = statements.pct >= 95 && branches.pct >= 95 && functions.pct >= 95 && lines.pct >= 95;

            const body = `## 📊 Backend Test Coverage

            | Metric | Coverage | Threshold | Status |
            |--------|----------|-----------|--------|
            | Statements | ${statements.pct}% | 95% | ${statements.pct >= 95 ? '✅' : '❌'} |
            | Branches | ${branches.pct}% | 95% | ${branches.pct >= 95 ? '✅' : '❌'} |
            | Functions | ${functions.pct}% | 95% | ${functions.pct >= 95 ? '✅' : '❌'} |
            | Lines | ${lines.pct}% | 95% | ${lines.pct >= 95 ? '✅' : '❌'} |

            ${allMet ? '✅' : '❌'} **All thresholds must be ≥ 95%**`;

            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const coverageComment = comments.find(c => c.body.includes('📊 Backend Test Coverage'));

            if (coverageComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: coverageComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            if (!allMet) {
              core.setFailed(
                `Backend coverage below 95% threshold: ` +
                `statements=${statements.pct}%, branches=${branches.pct}%, ` +
                `functions=${functions.pct}%, lines=${lines.pct}%`
              );
            }

  # These scripts are the ones that decide whether a deploy really happened
  # (ENG-734), whether Greptile really passed (ENG-754), whether CI ever ran
  # at all (ENG-757), and whether anyone finds out a production deploy failed
  # (ENG-865), so they get their own regression suites. All run the real script
  # against a mocked CLI — no AWS access, no GitHub access, no Slack, ~30s.
  #
  # The job's gate is the `workflows` filter (`.github/**`), so a new script
  # here is covered without touching any paths filter.
  ci-scripts-tests:
    name: CI script tests
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-ci-scripts-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Lint CI scripts
        run: shellcheck .github/scripts/*.sh

      - name: Run eb-deploy.sh regression suite
        run: bash .github/scripts/eb-deploy.test.sh

      - name: Run greptile-gate.sh regression suite
        run: bash .github/scripts/greptile-gate.test.sh

      - name: Run merge-evidence.sh regression suite
        run: bash .github/scripts/merge-evidence.test.sh

      - name: Run trunk-deploy-state.sh regression suite
        run: bash .github/scripts/trunk-deploy-state.test.sh

      - name: Run deploy-failure-alert.sh regression suite
        run: bash .github/scripts/deploy-failure-alert.test.sh

      - name: Run eb-config-conflict.sh regression suite
        run: bash .github/scripts/eb-config-conflict.test.sh

  # ENG-836: prod deploys immutable, which forbids changing resource config and
  # instance config in one operation. PR #2237 did exactly that, EB accepted the
  # request then refused it, and production sat undeployable for ~29 hours while
  # every later merge inherited the same failure.
  #
  # Staging cannot catch it — staging is AllAtOnce, which has no such
  # restriction, so it accepted the identical change and reported green. This
  # job is the substitute for a check staging structurally cannot perform.
  #
  # Runs on the PR diff, so it is deliberately NOT behind the `workflows`
  # filter: the files it guards are under `backend/`, not `.github/`.
  eb-config-conflict:
    name: EB resource/instance config conflict
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-eb-config-conflict-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check for a resource+instance config conflict
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Lets a DELETED config be classified by what it removed, rather than
          # guessed at. Removing a file that declared `aws:elbv2:loadbalancer`
          # is a resource change; removing one that declared `commands:` is an
          # instance change. `fetch-depth: 0` above is what makes this readable.
          EB_CONFLICT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          # Three dots: only what this PR changed relative to the merge base,
          # so commits that landed on the base branch meanwhile are not blamed
          # on this PR.
          #
          # --no-renames: with rename detection ON, git reports a rename as the
          # DESTINATION path only. The classifier would then look that path up
          # in the base revision, find nothing, and lose every declaration that
          # existed at the source — so renaming a config while dropping its
          # resource block, alongside an instance change, would pass. Turning
          # detection off reports the rename as a delete plus an add, and both
          # sides get classified: the old path from base, the new from head.
          git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" \
            | bash .github/scripts/eb-config-conflict.sh

  # This job used to poll Greptile's own `Greptile Review` check-run and pass on
  # conclusion=success. Greptile marks that check-run success for every completed
  # review regardless of confidence score, so the job went green on 3/5 and 4/5
  # reviews carrying live P1s. The 5/5 bar was held up by an agent choosing to
  # open the comment and read the score — discipline, not a control (ENG-754).
  # It now reads the score and the reviewed-commit pointer out of the comment
  # body and fails closed. See .github/scripts/greptile-gate.sh for why the
  # comment is the only source of the score.
  greptile-review:
    name: Require Greptile Review
    needs: detect-changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The script's own deadline is 20 minutes, leaving 5 minutes of runner
    # budget so the gate fails with a diagnosable message instead of being
    # killed mid-poll — the ENG-734 shape of a step timeout undercutting the
    # budget it is supposed to contain.
    timeout-minutes: 25
    # A newer commit on the same PR cancels this superseded Greptile-wait job.
    concurrency:
      group: ${{ github.workflow }}-greptile-review-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Deliberately the PR's own copy of the gate, not main's: whatever gates
      # merges has to gate its own changes, or the fix ships unexercised
      # (the ENG-743 lesson).
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Require a true Greptile 5/5 on this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/greptile-gate.sh

  backend-staging-deploy:
    name: Backend deploy to staging (after tests pass)
    needs: [detect-changes, backend-tests-a, backend-tests-b, greptile-review]
    if: github.event.pull_request.draft == false && needs.detect-changes.outputs.backend == 'true' && needs.backend-tests-a.result == 'success' && needs.backend-tests-b.result == 'success' && needs.greptile-review.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: backend-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Copy dev env user-data script into dist
        working-directory: backend
        run: cp ../test-env/user-data-dev-auto.sh dist/

      # Resolved once and reused by every later step, like deploy.yml's backend
      # job: the date and PR suffix used to be recomputed in three places, so a
      # run crossing midnight could upload one label and deploy another.
      #
      # The short SHA is what makes the verification below mean anything. A PR
      # deploys to staging on every push, and a label of only `-prN` is the same
      # string on every one of those pushes — so the environment is already
      # reporting that VersionLabel before this run starts, and "the environment
      # took our version" would be satisfied by a deploy that never ran. With
      # the SHA the label names exactly one build, which is also what makes a
      # rollback to a labelled version reproducible (ENG-743).
      - name: Resolve staging version label
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION_LABEL="backend-$(date +%Y%m%d)-pr${{ github.event.pull_request.number }}-${SHORT_SHA}"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "Resolved staging version label: ${VERSION_LABEL}"

      - name: Package artifact
        working-directory: backend
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          mkdir -p builds
          zip -r "builds/${VERSION_LABEL}.zip" dist package.json package-lock.json .env.example .platform .ebextensions || zip -r "builds/${VERSION_LABEL}.zip" dist package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deployment package to S3
        working-directory: backend
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          set -euo pipefail
          aws s3 cp "builds/${VERSION_LABEL}.zip" \
            "s3://elasticbeanstalk-${{ env.AWS_REGION }}-992382574572/builds/${VERSION_LABEL}.zip"

      # Creates the application version, applies it, and then proves the
      # environment actually came up on it. Every AWS failure fails this step —
      # see .github/scripts/eb-deploy.sh (ENG-734, wired to staging in ENG-743).
      # The script's own budget stays under this step's timeout so it always
      # reports the reason instead of being killed mid-poll; together they keep
      # the 35 minutes the previous deploy + readiness steps allowed.
      - name: Deploy to Elastic Beanstalk and verify the environment took it
        timeout-minutes: 35
        env:
          EB_APPLICATION_NAME: ${{ vars.EB_BACKEND_STAGING_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_BACKEND_STAGING_ENVIRONMENT_NAME }}
          EB_VERSION_LABEL: ${{ steps.version.outputs.version_label }}
          EB_SOURCE_BUNDLE_S3_BUCKET: elasticbeanstalk-${{ env.AWS_REGION }}-992382574572
          EB_SOURCE_BUNDLE_S3_KEY: builds/${{ steps.version.outputs.version_label }}.zip
          EB_TOTAL_TIMEOUT_SECONDS: '1800'
        run: bash .github/scripts/eb-deploy.sh

      # Only reachable when the step above proved the environment is Ready on
      # this exact version, so this banner is now a report rather than a claim.
      - name: Backend Staging Deployment Status
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        run: |
          echo "🚀 Backend staging deployment verified!"
          echo "📊 Check deployment status: https://${{ env.AWS_REGION }}.console.aws.amazon.com/elasticbeanstalk/home?region=${{ env.AWS_REGION }}#/environments"
          echo "✅ Environment ${{ vars.EB_BACKEND_STAGING_ENVIRONMENT_NAME }} is running: ${VERSION_LABEL}"
          echo "🔗 Staging URL: https://api-stage.agentweb.pro"

  partner-tests:
    name: Partner portal tests
    needs: detect-changes
    if: needs.detect-changes.outputs.partner == 'true'
    runs-on: ubuntu-latest
    # A newer commit on the same PR cancels this superseded test job.
    concurrency:
      group: ${{ github.workflow }}-partner-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: 'npm'
          cache-dependency-path: partner-portal/package-lock.json

      - name: Install dependencies
        working-directory: partner-portal
        run: npm ci

      - name: Build
        working-directory: partner-portal
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Test
        working-directory: partner-portal
        shell: bash
        run: |
          set -euo pipefail
          TEST_SCRIPT=$(jq -r '.scripts.test // ""' package.json)
          if [ -z "$TEST_SCRIPT" ] || [[ "$TEST_SCRIPT" == 'echo "Error: no test specified" && exit 1' ]]; then
            echo "Skipping tests (no real test script)."
            exit 0
          fi
          npm test --silent
