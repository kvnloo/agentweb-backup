name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # ENG-3038: the dev.md consolidation PR is opened with GITHUB_TOKEN, which
  # cannot start a pull_request run, so dev-md-fragments.yml dispatches this
  # workflow on that PR's branch instead. Only that branch is honoured: its
  # diff is held to dev.md plus removed fragments by the fragment guard, so
  # there is nothing to build and the path filter is not consulted. A dispatch
  # on any other ref fails `Detect changed projects`, so it cannot stand in for
  # a PR's real run. That job's `if:` is deliberately untouched (merge-evidence
  # pins it): a dispatch has no pull_request payload, and GitHub's loose
  # equality reads `null == false` as true, so the job runs.
  workflow_dispatch:

# Product test suites run on Atem only when they protect a retained invariant or
# a reproduced regression. GitHub Actions proves buildability and CI/deploy
# control integrity; production deployment proves the runtime path.
permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect changed projects
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-detect-${{ github.ref }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: true
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      partner: ${{ steps.filter.outputs.partner }}
      workflows: ${{ steps.filter.outputs.workflows }}
      ebconfig: ${{ steps.filter.outputs.ebconfig }}
      remotion: ${{ steps.filter.outputs.remotion }}
      slackstart: ${{ steps.filter.outputs.slackstart }}
    steps:
      - name: Refuse a dispatch off the consolidation branch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'automation/dev-md-consolidate'
        run: |
          echo "Build is dispatched only on automation/dev-md-consolidate (ENG-3038); open a pull request instead." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/tests.yml'
              - '.github/scripts/eb-deploy.sh'
            partner:
              - 'partner-portal/**'
            workflows:
              - '.github/**'
            # ENG-1377: remotion-lambda had no CI of any kind. Under ENG-1463
            # it gets a build check, not a product test suite (see
            # remotion-build below). ENG-381 removed local-agent-relay.
            remotion:
              - 'remotion-lambda/**'
              - '.github/workflows/tests.yml'
            # ENG-2782: the embeddable widget and the copy of it the backend serves.
            slackstart:
              - 'packages/slack-start/**'
              - 'backend/src/embed/**'
              - '.github/workflows/tests.yml'
            ebconfig:
              - '**/.ebextensions/**'
              - '**/.platform/**'
              - '.github/scripts/eb-config-conflict.sh'
              - '.github/workflows/tests.yml'

  backend-build:
    name: Backend build
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-backend-build-${{ github.ref }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Production build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build
      - name: Agent Mode wiring invariant
        working-directory: backend
        run: node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit src/__tests__/loops.agentModeWiring.test.ts
      # Mock-only (no secrets, no database). Every registered tool must fit the plan route's limits: docs/plan-route-tool-limits.md
      - name: Plan route tool limits
        working-directory: backend
        run: node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit src/services/funding/__tests__/relayManifest.registry.test.ts

  partner-build:
    name: Partner portal build
    needs: detect-changes
    if: needs.detect-changes.outputs.partner == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-partner-build-${{ github.ref }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: partner-portal/package-lock.json
      - name: Install dependencies
        working-directory: partner-portal
        run: npm ci
      - name: Production build
        working-directory: partner-portal
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

  # These are short deterministic control-plane checks, not product tests.
  # They protect the deployment and merge mechanisms themselves and run only
  # when `.github/**` changes.
  ci-scripts-tests:
    name: CI script tests
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-ci-controls-${{ github.ref }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint CI scripts
        run: shellcheck .github/scripts/*.sh
      - name: Run CI/deploy control checks
        run: |
          set -euo pipefail
          bash .github/scripts/eb-deploy.test.sh
          bash .github/scripts/staging-deploy.test.sh
          bash .github/scripts/dependabot-only-pr.test.sh
          bash .github/scripts/dependabot-integrity-check.test.sh
          bash .github/scripts/dependabot-config.test.sh
          bash .github/scripts/merge-evidence.test.sh
          bash .github/scripts/trunk-deploy-state.test.sh
          bash .github/scripts/login-host-run-deploy.test.sh
          bash .github/scripts/login-host-verify-build.test.sh
          bash .github/scripts/deploy-base-sha.test.sh
          bash .github/scripts/deploy-failure-alert.test.sh
          bash .github/scripts/rollout-note.test.sh
          bash .github/scripts/deploy-launch-notify.test.sh
          bash .github/scripts/eb-config-conflict.test.sh
          bash .github/scripts/staging-env-override.test.sh
          bash .github/scripts/sha-jest.test.sh
          bash .github/scripts/pipefail-hygiene.test.sh
          bash .github/scripts/paths-filter-hygiene.test.sh
          bash .github/scripts/idor-probe.test.sh
          bash .github/scripts/offline-eval-report.test.sh
          bash .github/scripts/dev-md-fragments.test.sh

  # ENG-1377 / ENG-1463: build check only, not a product test suite.
  # ENG-2782: build check for packages/slack-start. Deploy-control integrity, not a
  # product suite: the bundle the backend serves (backend/src/embed/*.generated.ts)
  # must equal a fresh build of the package source, and every artifact must stay
  # within the 40 KB gzip budget. Vitest/Playwright suites run on Atem.
  slack-start-build:
    name: Slack-start widget build
    needs: detect-changes
    if: needs.detect-changes.outputs.slackstart == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-slack-start-build-${{ github.ref }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/slack-start/package-lock.json
      - name: Install dependencies
        working-directory: packages/slack-start
        run: npm ci
      - name: Typecheck
        working-directory: packages/slack-start
        run: npm run typecheck
      # Before `build`, which rewrites the generated file: compare the COMMITTED copy.
      - name: Served bundle matches source
        working-directory: packages/slack-start
        run: npm run check:embed
      - name: Build
        working-directory: packages/slack-start
        run: npm run build
      - name: 40 KB gzip budget
        working-directory: packages/slack-start
        run: npm run check:size

  remotion-build:
    name: Remotion lambda build
    needs: detect-changes
    if: needs.detect-changes.outputs.remotion == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-remotion-build-${{ github.ref }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: true
    steps:
      # persist-credentials: false — zizmor, via CodeRabbit on #2552. checkout
      # defaults to leaving a GITHUB_TOKEN auth header in .git/config, and this
      # job then runs `npm ci`, which executes install lifecycle scripts from
      # the PR-authored lockfile and could read the credential back out.
      # Nothing here needs it afterwards.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # node-version pinned (CodeRabbit on #2552). Without it the job floats on
      # whatever the hosted runner image ships, so the image changing under us
      # is indistinguishable from a real break. 22 is not a guess: this job's
      # first green run (32477303755) reported `node: v22.23.2`, so this pins
      # the version it is already known to pass on rather than picking one.
      #
      # Repo-wide gap, deliberately not fixed here: NOTHING in this repo pins
      # Node — no .nvmrc, no `engines` in any package.json, no `node-version` in
      # any workflow. Every other job floats too. Pinning one new job is worth
      # doing on its own, but it is not the fix for that.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion-lambda/package-lock.json

      # `npm ci`, which needs a lockfile — this project had none, so its pinned
      # dependency versions were only pinned in package.json and everything
      # transitive floated. The lockfile is committed in this same change.
      - name: Install dependencies
        working-directory: remotion-lambda
        run: npm ci

      # Its own `npm run build` (`npx tsc`) was ALREADY FAILING when this job
      # was written — a real type error in src/Root.tsx sitting on main with
      # nothing to catch it. The fix ships in the same commit; see
      # BrandedVideo.tsx.
      - name: Production build
        working-directory: remotion-lambda
        run: npm run build

  eb-config-conflict:
    name: EB resource/instance config conflict
    needs: detect-changes
    if: needs.detect-changes.outputs.ebconfig == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 12
    concurrency:
      group: ${{ github.workflow }}-eb-config-${{ github.ref }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a resource and instance configuration conflict
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EB_CONFLICT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" | bash .github/scripts/eb-config-conflict.sh
