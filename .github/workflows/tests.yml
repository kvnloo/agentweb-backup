name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'partner-portal/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: 'us-west-2'

jobs:
  detect-changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      partner: ${{ steps.filter.outputs.partner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            backend:
              - 'backend/**'
            partner:
              - 'partner-portal/**'

  backend-tests:
    name: Backend tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Verify version is same or higher than base
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF}"
          CURRENT_VERSION=$(jq -r .version backend/package.json)
          git fetch origin "$BASE_BRANCH" --depth=1
          BASE_VERSION=$(git show "origin/$BASE_BRANCH:backend/package.json" | jq -r .version)
          echo "Base version: $BASE_VERSION | PR version: $CURRENT_VERSION"
          if [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npx --yes semver -r ">=$BASE_VERSION" "$CURRENT_VERSION" >/dev/null || { echo "::error::PR version ($CURRENT_VERSION) must be same or higher than base ($BASE_VERSION)."; exit 1; }
          else
            echo "::warning::One of the versions is not valid semver; skipping enforcement"
          fi

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage -- --coverageReporters=text --coverageReporters=json-summary

      - name: Post coverage comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('backend/coverage/coverage-summary.json', 'utf8'));
            const { statements, branches, functions, lines } = coverage.total;

            const body = `## 📊 Backend Test Coverage

            | Metric | Coverage | Threshold |
            |--------|----------|-----------|
            | Statements | ${statements.pct}% | 90% |
            | Branches | ${branches.pct}% | 90% |
            | Functions | ${functions.pct}% | 90% |
            | Lines | ${lines.pct}% | 90% |

            ${branches.pct >= 90 ? '✅' : '❌'} **All thresholds must be ≥ 90%**`;

            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const coverageComment = comments.find(c => c.body.includes('📊 Backend Test Coverage'));

            if (coverageComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: coverageComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  backend-staging-deploy:
    name: Backend deploy to staging (after tests pass)
    needs: [detect-changes, backend-tests]
    if: needs.detect-changes.outputs.backend == 'true' && needs.backend-tests.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Package artifact
        working-directory: backend
        run: |
          VERSION=$(jq -r .version package.json)
          PR_NUMBER=${{ github.event.pull_request.number }}
          mkdir -p builds
          zip -r "builds/deploy_v${VERSION}-staging-pr${PR_NUMBER}.zip" dist package.json package-lock.json .env.example .platform .ebextensions || zip -r "builds/deploy_v${VERSION}-staging-pr${PR_NUMBER}.zip" dist package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk (Staging)
        timeout-minutes: 5
        working-directory: backend
        run: |
          VERSION=$(jq -r .version package.json)
          PR_NUMBER=${{ github.event.pull_request.number }}
          VERSION_LABEL="backend_v${VERSION}-staging-pr${PR_NUMBER}"
          echo "Deploying backend to staging version: $VERSION_LABEL"
          
          # Upload to S3
          echo "Uploading deployment package to S3..."
          aws s3 cp "builds/deploy_v${VERSION}-staging-pr${PR_NUMBER}.zip" "s3://elasticbeanstalk-${{ env.AWS_REGION }}-992382574572/builds/backend_deploy_${VERSION_LABEL}.zip"
          
          # Create new application version
          echo "Creating new application version..."
          aws elasticbeanstalk create-application-version \
            --application-name ${{ vars.EB_BACKEND_STAGING_APPLICATION_NAME }} \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="elasticbeanstalk-${{ env.AWS_REGION }}-992382574572,S3Key=builds/backend_deploy_${VERSION_LABEL}.zip" || echo "⚠️  Version creation failed (may already exist), continuing..."
          
          # Deploy to environment
          echo "Deploying to staging environment..."
          aws elasticbeanstalk update-environment \
            --environment-name ${{ vars.EB_BACKEND_STAGING_ENVIRONMENT_NAME }} \
            --version-label "$VERSION_LABEL" || echo "⚠️  Environment update failed (may be updating), but AWS deployment likely succeeded"

      - name: Backend Staging Deployment Status
        run: |
          VERSION=$(jq -r .version backend/package.json)
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "🚀 Backend staging deployment initiated successfully!"
          echo "📊 Check deployment status: https://${{ env.AWS_REGION }}.console.aws.amazon.com/elasticbeanstalk/home?region=${{ env.AWS_REGION }}#/environments"
          echo "✅ Version deployed: backend_v${VERSION}-staging-pr${PR_NUMBER}"
          echo "🔗 Staging URL: https://api-stage.agentweb.pro"

  partner-tests:
    name: Partner portal tests
    needs: detect-changes
    if: needs.detect-changes.outputs.partner == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: partner-portal/package-lock.json

      - name: Verify version is same or higher than base
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF}"
          CURRENT_VERSION=$(jq -r .version partner-portal/package.json)
          git fetch origin "$BASE_BRANCH" --depth=1
          BASE_VERSION=$(git show "origin/$BASE_BRANCH:partner-portal/package.json" | jq -r .version)
          echo "Base version: $BASE_VERSION | PR version: $CURRENT_VERSION"
          if [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npx --yes semver -r ">=$BASE_VERSION" "$CURRENT_VERSION" >/dev/null || { echo "::error::PR version ($CURRENT_VERSION) must be same or higher than base ($BASE_VERSION)."; exit 1; }
          else
            echo "::warning::One of the versions is not valid semver; skipping enforcement"
          fi

      - name: Install dependencies
        working-directory: partner-portal
        run: npm ci

      - name: Build
        working-directory: partner-portal
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build --if-present

      - name: Test
        working-directory: partner-portal
        shell: bash
        run: |
          set -euo pipefail
          TEST_SCRIPT=$(jq -r '.scripts.test // ""' package.json)
          if [ -z "$TEST_SCRIPT" ] || [[ "$TEST_SCRIPT" == 'echo "Error: no test specified" && exit 1' ]]; then
            echo "Skipping tests (no real test script)."
            exit 0
          fi
          npm test --silent


