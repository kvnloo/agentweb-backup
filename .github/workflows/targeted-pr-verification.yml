name: Targeted PR Verification

on:
  push:
    branches:
      - kvn/h-learn-2a-reliability-proposals

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Targeted regression suite
        working-directory: backend
        run: node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit src/__tests__/reliabilityLearning.test.ts
