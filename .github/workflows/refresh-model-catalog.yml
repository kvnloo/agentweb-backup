name: Refresh model catalog
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-model-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - name: Prepare code-only catalog patch
        working-directory: backend
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: npx ts-node --transpile-only src/scripts/refreshModelCatalog.ts --write > /tmp/model-catalog-plan.json
      - name: Refresh capability evidence for added models
        working-directory: backend
        run: |
          if node -e 'process.exit(require("/tmp/model-catalog-plan.json").additions.length ? 0 : 1)'; then
            npm run refresh:openrouter-params
          fi
      - name: Verify critical catalog and price-book invariants
        working-directory: backend
        run: npx jest --runInBand --runTestsByPath src/services/agentMode/__tests__/modelCatalogRefresh.test.ts src/__tests__/llmPricing.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: model-catalog-plan
          path: /tmp/model-catalog-plan.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/model-catalog-refresh
          base: main
          author: deploy <deploy@agentweb.pro>
          committer: deploy <deploy@agentweb.pro>
          draft: true
          title: 'Refresh model catalog, pricing and benchmark scores'
          commit-message: 'chore: refresh model catalog from OpenRouter and Artificial Analysis'
          body: |
            Refresh supported product lines from OpenRouter and benchmark scores from Artificial Analysis.
            Missing AA credentials preserve existing scores. Inspect the model-catalog-plan artifact for unmatched scores, proposed prices, and supersession.

            New entries are marked auto-added. Review capabilities and customer-facing descriptions before marking ready. Existing Azure BYOK pricing is preserved.
            No database writes or changes to saved model selections. Rollback: revert this PR.
            Complexity: extends the existing registry and price book; no new runtime service or storage.
          add-paths: |
            backend/src/services/agentMode/llmModelRegistry.ts
            backend/src/utils/llmPricing.ts
            backend/src/__tests__/llmPricing.test.ts
            backend/src/services/agentMode/__tests__/fixtures/openRouterSupportedParameters.json
