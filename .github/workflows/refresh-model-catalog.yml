name: Frontier monitor and model catalog
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-model-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - name: Monitor frontier and prepare code-only catalog patch
        working-directory: backend
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          SLACK_MODEL_ALERTS_WEBHOOK: ${{ secrets.SLACK_MODEL_ALERTS_WEBHOOK }}
        run: npx ts-node --transpile-only src/scripts/frontierMonitor.ts --write --notify > /tmp/model-catalog-plan.json
      - name: Refresh capability evidence for added models
        working-directory: backend
        run: |
          if node -e 'process.exit(require("/tmp/model-catalog-plan.json").additions.length ? 0 : 1)'; then
            npm run refresh:openrouter-params
          fi
      - name: Verify critical catalog and price-book invariants
        working-directory: backend
        run: npx jest --runInBand --runTestsByPath src/services/agentMode/__tests__/modelCatalogRefresh.test.ts src/services/agentMode/__tests__/frontierMonitor.test.ts src/__tests__/llmPricing.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-catalog-plan
          path: |
            /tmp/model-catalog-plan.json
            docs/openrouter-byok-coverage.md
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/model-catalog-refresh
          base: main
          author: deploy <deploy@agentweb.pro>
          committer: deploy <deploy@agentweb.pro>
          draft: true
          title: 'Refresh frontier models and OpenRouter BYOK coverage'
          commit-message: 'chore: refresh model catalog from OpenRouter and Artificial Analysis'
          body: |
            Daily frontier detection using OpenRouter release dates and the Artificial Analysis top 10.
            Auto-add validated text/tool models in tracked families or top-N models from tracked providers.
            Include advertised cloud BYOK endpoint coverage; credentials and quota are not verified.
            Missing AA credentials preserve existing scores. Inspect the model-catalog-plan artifact for unmatched scores, proposed prices, and supersession.

            New entries are marked auto-added. Review capabilities and customer-facing descriptions before marking ready. Existing Azure BYOK pricing is preserved.
            No database writes or changes to saved model selections. Rollback: revert this PR.
            Complexity: extends the existing registry and price book; no new runtime service or storage.
          add-paths: |
            backend/src/services/agentMode/llmModelRegistry.ts
            backend/src/utils/llmPricing.ts
            backend/src/__tests__/llmPricing.test.ts
            backend/src/services/agentMode/__tests__/fixtures/openRouterSupportedParameters.json
            docs/openrouter-byok-coverage.md
      - name: Surface incomplete upstream observations
        run: node -e 'if (require("/tmp/model-catalog-plan.json").degraded) { console.error("Upstream observation incomplete; inspect monitor report"); process.exit(1); }'
