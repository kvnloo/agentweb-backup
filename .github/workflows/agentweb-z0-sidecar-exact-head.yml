name: AgentWeb z0 Sidecar Exact-Head E2E

on:
  pull_request:
    branches:
      - lab/z0-backpressure-circuit-v1
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout AgentWeb exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned z0intelligence sidecar head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kvnloo/z0intelligence
          ref: 72bc3c77d813a06665b6ef9541b0f7b6868392fa
          path: deps/z0intelligence
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record exact source heads
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          roots = {
              "agentweb": ".",
              "z0intelligence": "deps/z0intelligence",
          }
          heads = {
              name: subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"],
                  text=True,
              ).strip()
              for name, path in roots.items()
          }
          Path("/tmp/z0-sidecar-heads.json").write_text(
              json.dumps(heads, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(heads, indent=2))
          PY

      - name: Install AgentWeb dependencies
        working-directory: backend
        run: npm ci

      - name: Build AgentWeb backend
        working-directory: backend
        run: npm run build

      - name: Run AgentWeb sidecar regressions
        working-directory: backend
        run: |
          node --test scripts/test-z0-sidecar-startup.cjs
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand --forceExit \
            src/__tests__/experiments.z0SidecarDeployment.test.ts \
            src/__tests__/experiments.z0BridgeBackpressure.test.ts \
            src/__tests__/experiments.z0BridgeCapabilities.test.ts \
            src/__tests__/experiments.z0Integration.test.ts

      - name: Install narrow z0 test dependencies
        run: python -m pip install pytest==8.4.2 typesafe-sdk==0.7.2

      - name: Run pinned z0 sidecar/bridge contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/deps/z0intelligence/src
        run: |
          python -m pytest -q \
            deps/z0intelligence/tests/test_agentweb_sidecar_profile.py \
            deps/z0intelligence/tests/test_agentweb_bridge_overload.py \
            deps/z0intelligence/tests/test_agentweb_bridge_capabilities.py

      - name: Start real pinned z0 sidecar
        env:
          PYTHONPATH: ${{ github.workspace }}/deps/z0intelligence/src
          Z0INT_HOME: /tmp/z0int-sidecar-home
        run: |
          mkdir -p "$Z0INT_HOME"
          python -m z0int.intelligence_service \
            --bind 127.0.0.1 \
            --port 11501 \
            > /tmp/z0int-sidecar.log 2>&1 &
          echo $! > /tmp/z0int-sidecar.pid

          python - <<'PY'
          import time
          import urllib.request

          last = None
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:11501/healthz", timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(0.25)
          raise SystemExit(f"z0 sidecar failed to become healthy: {last}")
          PY

      - name: Run real AgentWeb to z0 startup/shadow proof
        working-directory: backend
        env:
          Z0INT_SERVICE_URL: http://127.0.0.1:11501
        run: |
          node scripts/check-z0-sidecar-real.cjs /tmp/z0-sidecar-real.json

      - name: Verify real-sidecar receipt
        run: |
          python - <<'PY'
          import json

          result = json.load(open("/tmp/z0-sidecar-real.json"))
          assert result["schema"] == "z0eval.agentweb_sidecar_real_e2e.v1"
          assert result["base_url"] == "http://127.0.0.1:11501"
          assert result["startup_get_count"] == 4
          assert result["shadow_post_count"] == 2
          assert result["raw_identity_exported"] is False
          assert result["model_dispatch_expected"] is False
          assert result["first"]["executed"] is False
          assert result["second"]["executed"] is False
          assert result["first"]["reconcile_required"] is False
          assert result["second"]["reconcile_required"] is False
          PY

      - name: Stop z0 sidecar
        if: always()
        run: |
          if test -f /tmp/z0int-sidecar.pid; then
            kill "$(cat /tmp/z0int-sidecar.pid)" || true
          fi
          cat /tmp/z0int-sidecar.log || true

      - name: Upload exact-head sidecar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentweb-z0-sidecar-exact-head
          path: |
            /tmp/z0-sidecar-heads.json
            /tmp/z0-sidecar-real.json
            /tmp/z0int-sidecar.log
