name: AgentWeb z0 Reliability E2E

on:
  pull_request:
    branches: [lab/upstream-20260929]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AgentWeb fork branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout z0intelligence fork branch
        uses: actions/checkout@v4
        with:
          repository: kvnloo/z0intelligence
          ref: lab/agentweb-emma-v0
          path: deps/z0intelligence
          persist-credentials: false

      - name: Checkout z0evals study branch
        uses: actions/checkout@v4
        with:
          repository: kvnloo/z0evals
          ref: study/agentweb-emma-z0-v0
          path: deps/z0evals
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Record exact dependency heads
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          roots = {
              "agentweb": ".",
              "z0intelligence": "deps/z0intelligence",
              "z0evals": "deps/z0evals",
          }
          out = {
              name: subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()
              for name, path in roots.items()
          }
          Path("/tmp/agentweb-reliability-heads.json").write_text(
              json.dumps(out, indent=2) + "\n"
          )
          print(json.dumps(out, indent=2))
          PY

      - name: Install AgentWeb dependencies
        working-directory: backend
        run: npm ci

      - name: Start z0intelligence observation service
        env:
          Z0INT_HOME: /tmp/z0int-reliability-home
          PYTHONPATH: ${{ github.workspace }}/deps/z0intelligence/src
        run: |
          mkdir -p "$Z0INT_HOME"
          python -m z0int.intelligence_service --port 11501 > /tmp/z0int-reliability.log 2>&1 &
          echo $! > /tmp/z0int-reliability.pid
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:11501/healthz"
          last = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          print("z0intelligence ready")
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(.25)
          raise SystemExit(f"z0intelligence did not become ready: {last}")
          PY

      - name: Run 7-case cross-repo reliability campaign
        working-directory: backend
        env:
          Z0INT_SERVICE_URL: http://127.0.0.1:11501
        run: |
          npm run study:z0-reliability --             ../deps/z0evals/studies/agentweb-emma-z0-v0/reliability-observation-fixtures.jsonl             /tmp/agentweb-reliability-results.jsonl

      - name: Score durable z0 receipts
        run: |
          python deps/z0evals/scripts/score_agentweb_reliability.py             /tmp/agentweb-reliability-results.jsonl             /tmp/z0int-reliability-home/receipts/decisions.jsonl             --output /tmp/agentweb-reliability-summary.json
          cat /tmp/agentweb-reliability-summary.json
          python - <<'PY'
          import json
          s = json.load(open("/tmp/agentweb-reliability-summary.json"))
          assert s["n_results"] == 7
          assert s["n_observed_receipts"] == 7
          assert s["passed"] is True, s
          PY

      - name: Stop z0intelligence
        if: always()
        run: |
          if test -f /tmp/z0int-reliability.pid; then
            kill "$(cat /tmp/z0int-reliability.pid)" || true
          fi
          cat /tmp/z0int-reliability.log || true

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentweb-z0-reliability-e2e
          path: |
            /tmp/agentweb-reliability-heads.json
            /tmp/agentweb-reliability-results.jsonl
            /tmp/agentweb-reliability-summary.json
            /tmp/z0int-reliability-home/receipts/decisions.jsonl
            /tmp/z0int-reliability.log
