name: agent-engine
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - boto3
  - playwright
  - pytest
  - pip:
    - browser-use==0.8.0
    # browser_use/config.py imports pydantic_settings directly but browser-use's
    # own package metadata doesn't declare it as a dependency (upstream bug) —
    # pin it explicitly or `import browser_use` fails with ModuleNotFoundError.
    - pydantic-settings
    - aiohttp>=3.8.0
    - beautifulsoup4>=4.9.3
    - python-dotenv>=0.19.0
    - langchain>=0.1.0
    - langchain-openai>=0.0.5
    - langchain-anthropic>=0.1.1
    - humanize
    - openai>=1.12.0
    - cryptography>=42.0.0
    - google-cloud-storage>=2.10.0
    - google-cloud-discoveryengine
    - google-cloud-secret-manager>=2.20.0
    - google-genai>=1.8.0
