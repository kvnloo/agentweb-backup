# Added 2026-08-04. See /etc/systemd/system/autofix-chat.service.d/10-memory.conf.
# Holds cron autofix cycles (run.sh -> poll.mjs -> autofix.mjs -> tsc/claude, up to
# maxForcedConcurrent=3 heavy fixes) AND interactive ec2-user SSH sessions. Deliberately NOT
# applied to the user-.slice template, so root (user-0.slice) stays uncapped as a recovery path.
#
# Sizing rationale: MemoryMax is a RUNAWAY catch, not an aggregate budget -- it exists to stop a
# single pathological process (Jul-30 saw one claude.exe at 17.6GB anon-rss) before it can drag
# the host down. Aggregate pressure is handled by systemd-oomd on swap/PSI, which fires well
# before the kernel's global OOM. 16G leaves room for 3 concurrent ~4GB tsc runs.
#
# Amended 2026-08-05, mirroring the autofix-chat.service change (see that file for the full
# post-mortem). Short version: MemoryHigh is a throttle, the reclaim it forces reads as PSI
# distress, and ManagedOOMMemoryPressure=kill then kills the whole cgroup for it -- which here
# would take out running cron autofix cycles and any live SSH session at once. That rule is off;
# swap-kill and the MemoryMax wall remain. MemoryMax 16G -> 14G so this slice and
# autofix-chat.service sum to 28G and cannot over-commit the ~30.9G host between them; 14G still
# leaves room for the 3 concurrent ~4GB tsc runs this slice was sized for.
[Slice]
MemoryAccounting=yes
MemoryHigh=13G
MemoryMax=14G
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=auto
