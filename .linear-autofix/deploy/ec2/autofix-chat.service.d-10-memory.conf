# Added 2026-08-04. Guardrails against the Aug-3 global OOM wedge. Revert = delete this file
# + `sudo systemctl daemon-reload && sudo systemctl restart autofix-chat`.
#
# Amended 2026-08-05 after this unit was oomd-killed 3x in 48 minutes (11:57, 12:26, 12:45 UTC;
# 297 processes and every in-flight chat turn lost at the 12:26 kill). Post-mortem: NOT a runaway
# and NOT the kernel OOM killer. The unit died at 11.9-12.0G -- exactly MemoryHigh, never near
# MemoryMax -- because MemoryHigh is a THROTTLE: crossing it makes the kernel reclaim hard inside
# the cgroup, and that reclaim IS the PSI stall that `ManagedOOMMemoryPressure=kill` then kills on
# (logged: "pressure ... 91.54% > 60.00% for > 20s with reclaim activity"). So the soft guardrail
# was manufacturing the very distress signal the hard guardrail killed for, and `OOMPolicy=continue`
# could not help because oomd kills the whole cgroup including the supervisor.
[Service]
# Box has ~30.9GiB usable. Budget: this unit 14G max, user-1000.slice 14G max, ~2.9G for the
# system. MemoryHigh throttles + reclaims first (soft), MemoryMax is the hard cgroup-OOM wall.
# A breach now kills THIS cgroup instead of triggering a global OOM that wedges the host.
#
# 2026-08-05: MemoryMax lowered 16G -> 14G so the two capped cgroups sum to 28G and can no longer
# over-commit the host between them (16+16=32G exceeded it, which left oomd as the only aggregate
# guard). MemoryHigh raised 12G -> 13G to sit just under that wall: still an early throttle, but
# no longer a full 4G of throttled-reclaim runway in which oomd can decide we are dying.
MemoryAccounting=yes
MemoryHigh=13G
MemoryMax=14G

# Let systemd-oomd pick this cgroup when swap is nearly gone. Swap exhaustion is a true
# host-wide-distress signal and stays enabled -- it, not the pressure rule, is what actually
# guards against the Aug-3 wedge.
ManagedOOMSwap=kill

# 2026-08-05: set to `auto` i.e. NOT opted in (was `kill`). The PSI-pressure rule cannot tell "a 3.2GB `tsc --noEmit`
# spiked for 40s inside a healthy cgroup" from "this cgroup is dying", and it fires on the reclaim
# that MemoryHigh itself causes -- so every heavy build that touched the ceiling took the whole
# service down while the HOST still had 16-20G free. A genuine breach is now handled the way this
# file's own comments intended: the kernel's cgroup OOM killer at MemoryMax reaps the single
# largest allocator (in practice the tsc/vite that caused the spike) and `OOMPolicy=continue`
# keeps the supervisor and every other in-flight turn alive.
ManagedOOMMemoryPressure=auto

# The Aug-4 shutdown left 11 orphans (npm exec vite / esbuild / ts-node / node) alive after the
# unit stopped -- "Unit process NNNN remains running after unit stopped" -- because KillMode=process
# only signals the main pid. Those orphans accumulate and feed the next OOM. control-group reaps
# the whole preview subtree; the extra stop time covers a graceful vite/esbuild teardown.
KillMode=control-group
TimeoutStopSec=45

# One OOM-killed child should not take the supervisor down; Restart=on-failure still covers a
# genuine main-process death.
OOMPolicy=continue
