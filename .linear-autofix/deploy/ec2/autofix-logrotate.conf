# ENG-655: durable size cap for the autofix runner logs so they can't grow unbounded. Installed by
# bootstrap.sh to /etc/logrotate.d/autofix; the system logrotate timer (logrotate.timer) runs it daily.
#
# This is an INDEPENDENT backstop to run.sh's per-cycle rotation (which renames poll.log / copytruncates
# chat.log at ~5MB). run.sh's rotation only fires while the poll cron is running — if the poller stops
# (the exact failure ENG-655 is about) the chat server keeps writing chat.log forever; logrotate.daily
# still caps it. copytruncate because the chat server (systemd StandardOutput=append + the server's own
# O_APPEND writes) holds chat.log open — a rename would strand its writes on the old inode.
/home/ec2-user/agentweb/.linear-autofix/poll.log
/home/ec2-user/agentweb/.linear-autofix/poll.log.1
/home/ec2-user/agentweb/.linear-autofix/chat/chat.log
/home/ec2-user/agentweb/.linear-autofix/chat/chat.log.1 {
    su ec2-user ec2-user
    size 20M
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
