<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autofix Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e2230; --border: #2a2f3d;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #6ea8fe; --user: #2b3a55;
    --green: #3fb27f; --amber: #d9a441; --red: #e5655e; --gray: #6b7280; --blue: #5b9dd9; --orange: #e08a3c;
  }
  * { box-sizing: border-box; margin: 0; }
  /* Modern, minimal scrollbars: thin, rounded, translucent thumb that brightens on hover; no arrows. */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; }

  /* Sidebar */
  #side { width: 290px; min-width: 290px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #side h1 { font-size: 15px; padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #sideToggle, #sideOpen { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); border-radius: 7px; cursor: pointer; font-size: 15px; line-height: 1; padding: 4px 9px; }
  #sideToggle:hover, #sideOpen:hover { border-color: var(--accent); color: var(--text); }
  body.side-collapsed #side { display: none; }
  #sideOpen { display: none; position: absolute; top: 12px; left: 12px; z-index: 15; }
  body.side-collapsed #sideOpen { display: block; }
  body.side-collapsed #hdr { padding-left: 58px; }
  #side .sub { padding: 0 16px 10px; color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
  #showAll { color: var(--accent); cursor: pointer; user-select: none; }
  #searchWrap { padding: 0 12px 10px; position: relative; }
  #search { width: 100%; box-sizing: border-box; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 26px 7px 10px; font: inherit; font-size: 12px; }
  #search:focus { outline: none; border-color: var(--accent); }
  #searchClear { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--dim); cursor: pointer; font-size: 14px; line-height: 1; display: none; user-select: none; }
  #searchClear:hover { color: var(--text); }
  #issues { overflow-y: auto; flex: 1; }
  .issue { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .issue:hover { background: var(--panel2); }
  .issue.sel { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 11px; }
  .issue .row1 { display: flex; align-items: center; gap: 8px; }
  .issue .id { font-weight: 600; }
  .issue .time { margin-left: auto; color: var(--dim); font-size: 11px; }
  .issue .summ { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 9px; color: #0d0f13; font-weight: 600; }
  .b-green { background: var(--green); } .b-amber { background: var(--amber); } .b-red { background: var(--red); }
  .b-gray { background: var(--gray); } .b-orange { background: var(--orange); }
  .b-blue { background: var(--blue); animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .busydot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
  /* Thinking indicator (above composer while a turn runs) */
  #thinking { display: none; align-items: center; gap: 9px; padding: 8px 20px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--border); background: var(--panel); }
  #thinking .dots { display: inline-flex; gap: 4px; }
  #thinking .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  #thinking .dots i:nth-child(2) { animation-delay: .16s; }
  #thinking .dots i:nth-child(3) { animation-delay: .32s; }
  @keyframes bounce { 0%, 75%, 100% { transform: translateY(0); opacity: .35; } 35% { transform: translateY(-5px); opacity: 1; } }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #dropzone { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(10,12,18,.72); pointer-events: none; }
  #main.dropping #dropzone { display: flex; }
  #dropzone .dzbox { border: 2px dashed var(--accent); border-radius: 14px; padding: 22px 34px; font-size: 16px; color: var(--text); background: var(--panel); }
  /* Holds the chat scroll area + the jump pill, so the pill anchors to the BOTTOM OF THE CHAT
     (just above the thinking/composer stack) rather than a fixed distance from the window. */
  #chatwrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  #jumpDown { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 5; opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility .18s ease; background: var(--accent); color: #0d0f13; border: 0; border-radius: 16px; padding: 6px 14px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  #jumpDown.show { opacity: 1; visibility: visible; }
  #jumpDown:hover { filter: brightness(1.08); }
  #hdr { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #hdr .t { font-size: 15px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #hdr .meta { color: var(--dim); font-size: 12px; margin-top: 3px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  #hdr a { color: var(--accent); text-decoration: none; }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 3px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.on { border-color: var(--green); color: var(--green); }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); }

  #chat { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }

  /* Pipeline steps */
  #pipeline { max-width: 820px; }
  #pipeline .ptitle { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
  .stage { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: 6px; overflow: hidden; }
  .stage .shead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .stage .shead:hover { background: var(--panel2); }
  .stage .arrow { color: var(--dim); font-size: 11px; transition: transform .12s; }
  .stage.open .arrow { transform: rotate(90deg); }
  .stage .smeta { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
  .stage .sbody { display: none; border-top: 1px solid var(--border); background: #10131a; padding: 10px 14px; overflow-wrap: break-word; font-size: 12.5px; color: #c3cadb; max-height: 400px; overflow-y: auto; }
  .stage.open .sbody { display: block; }
  .stage .nolog { color: var(--dim); font-style: italic; }

  .msg { max-width: 780px; padding: 10px 14px 21px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: break-word; position: relative; }
  .msg.user { background: var(--user); align-self: flex-end; position: relative; padding-right: 52px; }
  /* Edit/delete icons live INSIDE the bubble's top-right (in the reserved right padding) so they
     never depend on bubble width — a wide bubble used to push a left-positioned icon over the sidebar. */
  .msg.user .edit, .msg.user .del { position: absolute; top: 7px; cursor: pointer; font-size: 13px; line-height: 1; opacity: 0; transition: opacity .12s; user-select: none; }
  .msg.user .edit { right: 9px; }
  .msg.user .del { right: 30px; }
  .msg.user:hover .edit, .msg.user:hover .del { opacity: .55; }
  .msg.user .edit:hover, .msg.user .del:hover { opacity: 1; }
  .msg.user.editing { outline: 1px solid var(--accent); }
  #editbar { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #editbar .warn { color: var(--amber); }
  #editbar button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #editbar button:hover { border-color: var(--accent); }
  #editbar .spacer { margin-left: auto; }
  #queuebar { margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #queuebar .qhead { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .qrow { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--dim); }
  .qrow .qn { flex: none; opacity: .7; }
  .qrow .qtext { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow .qx { flex: none; cursor: pointer; opacity: .6; padding: 0 2px; }
  .qrow .qx:hover { opacity: 1; color: var(--text); }
  #attach { flex: none; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; width: 42px; min-height: 42px; font-size: 17px; cursor: pointer; }
  #attach:hover { border-color: var(--accent); }
  #attachbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .attachchip { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--dim); max-width: 220px; }
  .attachchip .an { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attachchip .ax { cursor: pointer; opacity: .6; flex: none; }
  .attachchip .ax:hover { opacity: 1; color: var(--text); }
  .msg.user .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .msg.user .atts .att { font-size: 11px; color: var(--dim); background: rgba(0,0,0,.2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; }
  .msg.assistant { background: var(--panel2); align-self: flex-start; }
  /* WhatsApp-style local-time stamp tucked into the bubble's bottom-right corner (no extra row). */
  .ts-in { position: absolute; right: 12px; bottom: 5px; font-size: 10px; line-height: 1; color: var(--dim); }
  /* Markdown styling applies in BOTH chat bubbles (.msg) and pipeline stage bodies (.sbody),
     since both render md() output. Scoping to .msg only left stage reports with no spacing. */
  :is(.msg, .sbody) code { background: #10131a; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  :is(.msg, .sbody) pre { background: #10131a; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  :is(.msg, .sbody) pre code { background: none; padding: 0; }
  :is(.msg, .sbody) h3, :is(.msg, .sbody) h4 { font-size: 14px; font-weight: 600; line-height: 1.3; margin: 16px 0 6px; }
  :is(.msg, .sbody) p { margin: 9px 0; }
  :is(.msg, .sbody) ul, :is(.msg, .sbody) ol { margin: 9px 0; padding-left: 22px; }
  :is(.msg, .sbody) li { margin: 3px 0; }
  :is(.msg, .sbody) li > ul, :is(.msg, .sbody) li > ol { margin: 3px 0; }
  :is(.msg, .sbody) blockquote { border-left: 2px solid var(--border); padding-left: 10px; margin: 10px 0; color: var(--dim); }
  :is(.msg, .sbody) hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  :is(.msg, .sbody) table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; }
  :is(.msg, .sbody) th, :is(.msg, .sbody) td { border: 1px solid var(--border); padding: 4px 9px; text-align: left; }
  :is(.msg, .sbody) th { background: #10131a; font-weight: 600; }
  /* Trim the very first/last block's outer margin so content sits flush with the container padding
     (one level of nesting, since assistant text lives inside a run <div>). */
  :is(.msg, .sbody) > :first-child, :is(.msg, .sbody) > :first-child > :first-child { margin-top: 0; }
  :is(.msg, .sbody) > :nth-last-child(1 of :not(.ts-in):not(.edit):not(.del)), :is(.msg, .sbody) > :nth-last-child(1 of :not(.ts-in):not(.edit):not(.del)) > :last-child { margin-bottom: 0; }
  .sys { color: var(--dim); font-size: 12px; align-self: flex-start; padding: 0 6px; }
  .err { color: var(--red); font-size: 13px; align-self: flex-start; padding: 0 6px; }
  .tool { display: block; font-size: 12px; color: var(--dim); background: #12151d; border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; margin: 4px 0; cursor: pointer; max-width: 740px; }
  .tool .st { margin-right: 6px; }
  .tool .tprev { margin-left: 8px; color: #7f8798; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tool.open .tprev { display: none; } /* hide the truncated preview once the full body is shown */
  .tool .inp { display: none; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; color: #a8b0c2; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tool.open .inp { display: block; }
  /* Collapsible "work" accordion: the tool calls Claude made, folded away once the answer arrives. */
  .work { margin: 0 0 8px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.15); overflow: hidden; }
  .work-head { display: flex; align-items: center; gap: 7px; padding: 5px 10px; cursor: pointer; user-select: none; font-size: 12px; color: var(--dim); }
  .work-head:hover { color: var(--text); }
  .work-head .wtoggle { transition: transform .12s ease; display: inline-block; }
  .work.open .work-head .wtoggle { transform: rotate(90deg); }
  .work-body { display: none; padding: 2px 10px 8px; }
  .work.open .work-body { display: block; }
  .work-body .tool { max-width: none; }
  .work-body .textrun { color: var(--dim); font-size: 13px; margin: 6px 0; } /* intermediate thoughts, secondary to the answer */
  /* The final response — the main answer. A subtle accent bar sets it apart from the folded work. */
  .msg.assistant .work + .final { border-left: 2px solid var(--accent); padding-left: 11px; }
  .fixcard { border: 1px solid var(--border); border-left: 3px solid var(--green); background: var(--panel2); border-radius: 8px; padding: 10px 14px; align-self: flex-start; font-size: 13px; max-width: 780px; }
  .fixcard.failed { border-left-color: var(--red); }
  .fixcard a { color: var(--accent); }
  .turnmeta { color: var(--dim); font-size: 11px; align-self: flex-start; padding: 0 6px; }
  .turnmeta.heavy { color: var(--amber); font-weight: 600; }
  .ctxwarn { align-self: flex-start; max-width: 780px; margin: 2px 0 4px; padding: 8px 12px; font-size: 12px; color: var(--amber); background: rgba(217,164,65,.08); border: 1px solid rgba(217,164,65,.35); border-radius: 8px; }
  .ctxwarn .cw-go { color: var(--amber); cursor: pointer; text-decoration: underline; font-weight: 600; }
  .compactcard { align-self: stretch; margin: 8px 0; }
  .compactcard .ch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; color: var(--dim); font-size: 11px; }
  .compactcard .cl { flex: 1; height: 1px; background: var(--border); }
  .compactcard .cn { white-space: nowrap; letter-spacing: .3px; }
  .compactcard .ct { white-space: nowrap; color: var(--dim); opacity: .8; }
  .compactcard .cx-toggle { white-space: nowrap; color: var(--accent); }
  .compactcard:hover .cx-toggle { text-decoration: underline; }
  .compactcard .cx { display: none; margin-top: 10px; padding: 10px 14px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--panel2); border-radius: 8px; font-size: 13px; color: var(--text); }
  .compactcard.open .cx { display: block; }

  /* Composer */
  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px; position: relative; }
  #composer .row { display: flex; gap: 10px; align-items: flex-end; }
  #input { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; resize: none; min-height: 42px; max-height: 160px; }
  #input:focus { outline: 1px solid var(--accent); }
  #input:disabled { opacity: .45; cursor: not-allowed; }
  #send { background: var(--accent); color: #0d0f13; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
  #send.stop { background: var(--red); color: #fff; }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  #hint { color: var(--dim); font-size: 11px; margin-top: 6px; }
  #hint .cap-full { color: var(--amber); }
  #hint .vhint { opacity: .7; }
  /* Voice (push-to-talk) indicator — shown while the mic is open */
  #voice { display: none; align-items: center; gap: 9px; padding: 8px 20px; color: var(--red); font-size: 12px; border-top: 1px solid var(--border); background: var(--panel); }
  #voice .mic { width: 9px; height: 9px; border-radius: 50%; background: var(--red); animation: pulse 1.1s infinite; }
  #input.recording { outline: 1px solid var(--red); }
  /* Esc-Esc "jump to a previous message" picker (Claude Code style) */
  #picker { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
  #picker:focus { outline: none; }
  #picker .pbox { width: min(640px, 88%); max-height: 70%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.55); display: flex; flex-direction: column; overflow: hidden; }
  #picker .phead { padding: 11px 15px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  #picker .phead span { color: var(--dim); font-size: 11px; font-weight: 400; white-space: nowrap; }
  #picker .plist { overflow-y: auto; padding: 6px; }
  #picker .prow { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  #picker .prow .pt { color: var(--dim); font-size: 10px; white-space: nowrap; min-width: 54px; }
  #picker .prow .px { color: var(--text); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #picker .prow.sel { background: var(--user); }
  #picker .pempty { padding: 16px; color: var(--dim); font-size: 12px; text-align: center; }
  /* Slash-command autocomplete menu (above the composer) */
  #slashmenu { position: absolute; left: 20px; right: 20px; bottom: 100%; margin-bottom: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); overflow: hidden; display: none; z-index: 8; }
  #slashmenu .srow { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; cursor: pointer; }
  #slashmenu .srow.sel { background: var(--user); }
  #slashmenu .srow .sn { color: var(--accent); font-weight: 600; font-size: 13px; min-width: 92px; }
  #slashmenu .srow .sd { color: var(--dim); font-size: 12px; }
  /* /status & /context overlay (Esc dismisses) */
  #cmd { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.5); }
  #cmd:focus { outline: none; }
  #cmd .cbox { width: min(680px, 90%); max-height: 78%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.55); display: flex; flex-direction: column; overflow: hidden; }
  #cmd .chead { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  #cmd .chead span { color: var(--dim); font-size: 11px; font-weight: 400; white-space: nowrap; }
  #cmd .cbody { overflow-y: auto; padding: 14px 16px; font-size: 13px; }
  #cmd .krow { display: flex; gap: 12px; padding: 4px 0; }
  #cmd .krow .k { color: var(--dim); min-width: 132px; flex-shrink: 0; }
  #cmd .krow .v { color: var(--text); overflow-wrap: anywhere; }
  #cmd .cgrid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin: 14px 0 10px; }
  #cmd .cgrid i { aspect-ratio: 1; border-radius: 2px; background: var(--border); }
  #cmd .cgrid i.used { background: var(--accent); }
  #cmd .clegend { display: flex; gap: 18px; flex-wrap: wrap; }
  #cmd .clegend .ci { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
  #cmd .clegend .sw { width: 11px; height: 11px; border-radius: 2px; }
  #cmd .cnote { color: var(--dim); font-size: 11px; margin-top: 12px; }
  #cmd .pempty { padding: 8px 0; color: var(--dim); font-size: 12px; }
  #cmd .mrow { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  #cmd .csub { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin: 16px 0 8px; }
  #cmd .csub:first-child { margin-top: 0; }
  #cmd .usagewrap { display: flex; flex-direction: column; gap: 14px; margin-bottom: 4px; }
  #cmd .ubar .ubl { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--text); margin-bottom: 5px; }
  #cmd .ubar .ubp { color: var(--dim); font-variant-numeric: tabular-nums; }
  #cmd .utrack { height: 8px; border-radius: 5px; background: var(--border); overflow: hidden; }

<body>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Line-based markdown renderer. Everything is HTML-escaped BEFORE any transform (XSS-safe), code
// (fenced + inline) is shielded from inline transforms, and only http/https/mailto URLs are linked.
function safeHref(u) { return /^(https?:\/\/|mailto:)/i.test(u) ? u : null; }
function mdInline(t) {
  const codes = [];
  let h = esc(t);
  // Shield inline code behind a ␀ sentinel (can't occur in real text) before other transforms.
  h = h.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `␀${codes.length - 1}␀`; });
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) => { const s = safeHref(url); return s ? `<a href="${s}" target="_blank" rel="noopener noreferrer">${txt}</a>` : txt; });
  h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  h = h.replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
  h = h.replace(/␀(\d+)␀/g, (_, n) => `<code>${codes[+n]}</code>`);
  return h;
}
// A whole message that is one JSON value (optionally after a LABEL: prefix) -> pretty-print it.
function tryJsonBlock(s) {
  const m = String(s).match(/^\s*([A-Za-z_][A-Za-z0-9_]*\s*:)?\s*([[{][\s\S]*[\]}])\s*$/);
  if (!m) return null;
  try { const v = JSON.parse(m[2]); if (v && typeof v === 'object') return (m[1] ? m[1].replace(/\s*$/, '') + '\n' : '') + JSON.stringify(v, null, 2); } catch { /* not JSON */ }
  return null;
}
const codeBlock = (lang, body) => `<pre><code${lang ? ` class="language-${esc(lang)}"` : ''}>${esc(body)}</code></pre>`;
function md(s) {
  const jb = tryJsonBlock(s);
  if (jb != null) return codeBlock('json', jb);
  const lines = String(s).replace(/\r\n?/g, '\n').split('\n');
  let html = '', inCode = false, codeLang = '', code = [], list = null, para = [];
  // Inline over the WHOLE paragraph (not per line), so a **bold**/`code`/link that wraps across a
  // soft line break still matches — then turn the retained newlines into <br>.
  const flushPara = () => { if (para.length) { html += `<p>${mdInline(para.join('\n')).replace(/\n/g, '<br>')}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(l);
  const splitRow = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const open = !inCode && line.match(/^```(\w*)\s?(.*)$/);
    if (open) {
      const oneLine = open[2].match(/^(.*?)```\s*$/);
      if (oneLine) { flushPara(); flushList(); html += codeBlock(open[1], oneLine[1]); continue; }
      flushPara(); flushList(); inCode = true; codeLang = open[1]; code = [];
      if (open[2]) code.push(open[2]);
      continue;
    }
    if (inCode) {
      if (/^```\s*$/.test(line)) { html += codeBlock(codeLang, code.join('\n')); inCode = false; }
      else code.push(line);
      continue;
    }
    if (/^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); flushList(); html += '<hr>'; continue; }
    if (line.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      flushPara(); flushList();
      const headers = splitRow(line);
      const aligns = splitRow(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? 'center' : /-+:$/.test(c) ? 'right' : /^:-+/.test(c) ? 'left' : ''));
      i++;
      let body = '';
      while (i + 1 < lines.length && lines[i + 1].includes('|') && lines[i + 1].trim() !== '') {
        const cells = splitRow(lines[++i]);
        body += '<tr>' + cells.map((c, k) => `<td${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${mdInline(c)}</td>`).join('') + '</tr>';
      }
      const head = '<tr>' + headers.map((c, k) => `<th${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${mdInline(c)}</th>`).join('') + '</tr>';
      html += `<table>${head}${body}</table>`;
      continue;
    }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); const l = m[1].length > 3 ? 4 : 3; html += `<h${l}>${mdInline(m[2])}</h${l}>`; continue; }
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) { flushPara(); const want = ul ? 'ul' : 'ol'; if (list !== want) { flushList(); html += `<${want}>`; list = want; } html += `<li>${mdInline((ul || ol)[1])}</li>`; continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); html += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    if (line.trim() === '') { flushPara(); flushList(); continue; }
    // A standalone JSON line (e.g. a `LABEL: {…}` agent marker embedded in a prose transcript)
    // pretty-prints too — not just a whole-message JSON body.
    const jl = tryJsonBlock(line);
    if (jl != null) { flushPara(); flushList(); html += codeBlock('json', jl); continue; }
    flushList(); para.push(line);
  }
  if (inCode) html += codeBlock(codeLang, code.join('\n'));
  flushPara(); flushList();
  return html;
}

const OUTCOME_BADGE = {
  fixed: ['fixed','b-green'], fixed_needs_manual_test: ['manual test','b-amber'],
  fixed_needs_human: ['needs human','b-red'], cannot_fix: ['cannot fix','b-gray'],
  no_change: ['no change','b-gray'], started: ['running','b-blue'], recovered: ['retrying','b-blue'],
  blocked: ['blocked','b-orange'], recovery_failed: ['crashed','b-red'], setup_failed: ['setup failed','b-red'],
};
const badge = (o) => { const [t, c] = OUTCOME_BADGE[o] || [o, 'b-gray']; return `<span class="badge ${c}">${esc(t)}</span>`; };
const rel = (iso) => {
  if (!iso) return '';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m/60)}h` : `${Math.round(m/1440)}d`;
};

const fmtAt = (iso) => { try { return new Date(iso).toLocaleString(); } catch { return ''; } };
// Local-time label in the viewer's own timezone: always the date + time, so no stamp is ambiguous
// about which day it belongs to (an old fix run isn't mistaken for today's).
const fmtTime = (iso) => {
  try {
    const d = new Date(iso), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + t;
  } catch { return ''; }
};
function stampTime(bubbleEl, iso) {
  if (!bubbleEl || !iso) return;
  const ts = document.createElement('span');
  ts.className = 'ts-in';
  ts.textContent = fmtTime(iso); ts.title = fmtAt(iso); // full date on hover
  bubbleEl.appendChild(ts); // bottom-right corner of the bubble (absolute)
}

const S = { issues: [], sel: null, detail: null, showAll: false, search: '', busy: false, es: null, curBubble: null, editing: null, deleting: null, stick: true, picker: null, lastEsc: 0, slash: null, cmd: null, mergePhase: null, lastResult: '', compacting: false, lastSent: '', escArmed: 0, escText: '', queue: [], queuePaused: false, attachments: [] };
const COMMANDS = [
  { name: '/status', desc: 'Session & fix status' },
  { name: '/context', desc: 'Context window usage' },
  { name: '/compact', desc: 'Summarize & compact the conversation' },
];

// ---------- voice (push-to-talk): hold space to dictate via the browser's Web Speech API ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Auto-repeat of a held Space (esp. on X11) arrives as keyup→keydown pairs whose event timestamps
// are ~identical. We classify a space-keydown as auto-repeat only when it lands within REPEAT_GAP ms
// of the previous space-keyup — genuinely-typed spaces are always separated by other keystrokes, so
// their gap is far larger. RELEASE_MS is the tiny grace period after a keyup before we treat the key
// as truly released (must outlast the auto-repeat keyup→keydown gap).
const HOLD_MS = 300, REPEAT_GAP = 12, RELEASE_MS = 20, VOICE_LANG = 'en-US';
const V = { supported: !!SR, denied: false, pressActive: false, recording: false, holdTimer: null, releaseTimer: null, spaceUpTs: -1e9, interveningKey: true, rec: null, before: '', after: '', spaceAt: 0, awaitingFinal: false, finalTimer: null };

// ---------- sidebar ----------
let lastIssuesJson = '';
async function loadIssues() {
  try {
    const r = await (await fetch('/api/issues')).json();
    S.issues = r.issues || [];
    // Skip DOM churn when nothing changed (also keeps click targets stable).
    const j = JSON.stringify(S.issues) + S.showAll + S.search + S.sel;
    if (j !== lastIssuesJson) { lastIssuesJson = j; renderIssues(); }
  } catch { /* server briefly down */ }
}
function renderIssues() {
  const q = S.search.trim().toLowerCase();
  // When searching, look across ALL issues (not just the active set) so a resolved issue isn't
  // hidden by the active-only filter — otherwise you'd get "no match" for an issue that exists.
  let list = q ? S.issues : (S.showAll ? S.issues : S.issues.filter((i) => i.active));
  if (q) list = list.filter((i) => `${i.identifier} ${i.summary || ''} ${i.title || ''} ${i.branch || ''}`.toLowerCase().includes(q));
  $('count').textContent = `${list.length} issue${list.length === 1 ? '' : 's'}${q ? ' matched' : S.showAll ? '' : ' active'}`;
  $('showAll').textContent = S.showAll ? 'active only' : 'show all';
  $('searchClear').style.display = S.search ? 'block' : 'none';
  const empty = q ? `No issues match “${esc(S.search.trim())}”.` : 'Nothing active on this machine.';
  $('issues').innerHTML = list.map((i) => `
    <div class="issue ${i.identifier === S.sel ? 'sel' : ''}" data-id="${i.identifier}">
      <div class="row1"><span class="id">${esc(i.identifier)}</span>${badge(i.outcome)}
        ${i.chat.busy ? '<span class="busydot"></span>' : ''}<span class="time">${rel(i.at)}</span></div>
      <div class="summ">${esc(i.summary || i.title || i.branch || '')}</div>
    </div>`).join('') || `<div style="padding:16px;color:var(--dim)">${empty}</div>`;
  for (const el of $('issues').children) el.onclick = () => el.dataset.id && select(el.dataset.id);
}
$('showAll').onclick = () => { S.showAll = !S.showAll; lastIssuesJson = ''; renderIssues(); };
$('search').addEventListener('input', (ev) => { S.search = ev.target.value; lastIssuesJson = ''; renderIssues(); });
$('searchClear').onclick = () => { S.search = ''; $('search').value = ''; $('search').focus(); lastIssuesJson = ''; renderIssues(); };

// ---------- selection / detail ----------
async function select(id) {
  S.sel = id; S.curBubble = null; S.stick = true;
  S.queue = []; S.queuePaused = false; renderQueue(); // queued messages belong to the previously open issue
  S.attachments = []; renderAttachments();
  document.title = id + ' · Autofix Chat'; // show the issue key in the browser tab
  // Remember the open issue in the URL hash so a refresh (or a shared link) lands right back on it.
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);

  clearBars();
  lastIssuesJson = ''; renderIssues();
  $('empty').style.display = 'none';
  $('hdr').style.display = ''; $('chat').style.display = ''; $('composer').style.display = '';
  $('h-id').textContent = id; $('h-badges').innerHTML = ''; $('h-meta').textContent = 'loading…';
  $('chat').innerHTML = '';
  if (S.es) { S.es.close(); S.es = null; }
  try {
    const res = await fetch(`/api/issues/${id}`);
    if (S.sel !== id) return;
    if (!res.ok) { // stale hash (e.g. a bookmarked issue no longer tracked here) — fall back to the list
      S.sel = null; document.title = 'Autofix Chat';
      if (location.hash.slice(1) === id) history.replaceState(null, '', location.pathname + location.search);
      $('empty').style.display = ''; $('hdr').style.display = 'none'; $('chat').style.display = 'none'; $('composer').style.display = 'none';
      lastIssuesJson = ''; renderIssues();
      return;
    }
    const d = await res.json();
    S.detail = d;
    renderHeader(d); renderAll(d);
    setBusy(!!d.busy);
    openEvents(id);
  } catch { $('h-meta').textContent = 'failed to load'; }
  updateHint();
  if (!S.busy) $('input').focus(); // put the cursor in the composer, ready to type
}
function renderHeader(d) {
  const e = d.entry || {};
  $('h-id').textContent = d.identifier + (d.linear?.title ? ` — ${d.linear.title}` : '');
  $('h-badges').innerHTML = badge(e.outcome) + (e.triage ? ` <span class="badge b-gray">${esc(e.triage)}</span>` : '');
  const prs = (e.prs || []).map((p) => `<a href="${esc(p.url || p)}" target="_blank">PR (${esc(p.repo || 'repo')})</a>`).join(' ');
  $('h-meta').innerHTML = [
    e.branch ? `<span>⎇ ${esc(e.branch)}</span>` : '',
    prs,
    d.linear?.url ? `<a href="${esc(d.linear.url)}" target="_blank">Linear ↗</a>` : '',
    d.worktree?.exists ? '' : '<span>worktree gone (rebuilds on first message)</span>',
  ].filter(Boolean).join(' · ');
  renderPreviewBar();
}

// ---------- preview ----------
function renderPreviewBar() {
  const el = $('h-preview');
  const p = S.detail?.preview;
  let pv = '', pvAction = null;
  if (p) {
    if (p.refreshing) pv = '<button class="btn" disabled><span class="spin"></span>Refreshing preview…</button>';
    else if (p.busy) pv = '<button class="btn" disabled>⏳ preview working…</button>';
    else if (p.running && p.urls) {
      pv = `<button class="btn on" id="pv-btn">■ Disable preview</button><span>live:</span>`
        + `<a href="${esc(p.urls.customer)}" target="_blank">Customer ↗</a>`
        + `<a href="${esc(p.urls.partner)}" target="_blank">Partner ↗</a>`
        + `<a href="${esc(p.urls.api)}" target="_blank">API ↗</a>`;
      pvAction = 'down';
    } else { pv = '<button class="btn" id="pv-btn">▶ Enable preview</button>'; pvAction = 'up'; }
  }
  // Merge button (right side) — only for a full-access session that has open PR(s).
  const prCount = (S.detail?.entry?.prs || []).filter(Boolean).length;
  const canMerge = prCount > 0 && S.detail?.capability?.level === 'full';
  const mg = canMerge ? `<button class="btn" id="merge-btn"${S.busy || S.mergePhase ? ' disabled' : ''}>⛙ Merge PR${prCount > 1 ? 's' : ''}</button>` : '';
  el.innerHTML = pv + mg;
  if ($('pv-btn')) $('pv-btn').onclick = () => previewAction(pvAction);
  if ($('merge-btn')) $('merge-btn').onclick = startMerge;
}
async function mergePost(confirm) {
  const r = await fetch(`/api/issues/${S.sel}/chat/merge`, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ confirm }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); addSys('⚠ ' + (e.error || `merge request failed (${r.status})`), 'err'); S.mergePhase = null; renderPreviewBar(); }
}
function startMerge() {
  if (S.busy || S.mergePhase) return;
  S.mergePhase = 'prep'; renderPreviewBar();
  addSys('⛙ Preparing PR(s) for merge — syncing with the base, fixing CI, and waiting for green…', 'sys');
  mergePost(false);
}
function openMergeConfirm() {
  const n = (S.detail?.entry?.prs || []).filter(Boolean).length;
  const body = `<div class="pempty" style="color:var(--text);font-size:13px">All checks passed. Merge ${n} PR${n > 1 ? 's' : ''} now? This runs <code>gh pr merge --merge</code> on ${n > 1 ? 'each PR' : 'the PR'}.</div>`
    + `<div class="mrow"><button class="btn" id="mc-cancel">Cancel</button><button class="btn on" id="mc-go">Confirm merge</button></div>`;
  openCmd('Ready to merge', body);
  $('mc-cancel').onclick = () => { closeCmd(); };
  $('mc-go').onclick = () => { closeCmd(); S.mergePhase = 'merge'; renderPreviewBar(); mergePost(true); };
}
async function previewAction(action) {
  const r = await fetch(`/api/issues/${S.sel}/preview`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ action }),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    addSys('⚠ ' + (err.error || `preview request failed (${r.status})`), 'err');
    return;
  }
  if (S.detail) { S.detail.preview = { ...(S.detail.preview || {}), busy: true }; renderPreviewBar(); }
}

// ---------- pipeline steps ----------
function fmtMs(ms) { if (!ms) return ''; const m = Math.round(ms / 60000); return m >= 1 ? `${m}m` : `${Math.round(ms/1000)}s`; }
// Per-turn meta line. A turn that ran a long/expensive agent loop (many tool-call rounds, minutes,
// or real $) is flagged as "heavy" so it stands out — separate from context-window usage, which is
// a different metric. `turns` here is the CLI's num_turns = internal tool-call rounds for the message.
function addTurnMeta(e) {
  const turns = e.turns ?? 0;
  const parts = [`${turns} turn${turns === 1 ? '' : 's'}`, fmtMs(e.ms), e.cost != null ? '$' + e.cost.toFixed(2) : ''].filter(Boolean).join(' · ');
  const heavy = (e.cost != null && e.cost >= 1.5) || turns >= 20 || (e.ms || 0) >= 300000; // ≥$1.50, ≥20 rounds, or ≥5 min
  addSys((heavy ? '⚠ Heavy turn — ' : '⏱ ') + parts, heavy ? 'turnmeta heavy' : 'turnmeta');
}
function renderPipeline(d) {
  const steps = d.pipeline || [];
  if (!steps.length) return;
  const wrap = document.createElement('div');
  wrap.id = 'pipeline';
  wrap.innerHTML = `<div class="ptitle">⚙ What the automation did (${steps.length} steps — click to expand)</div>`;
  const runAt = d.entry?.at ? fmtTime(d.entry.at) : ''; // stages have no per-step time; use the fix run time
  for (const s of steps) {
    const el = document.createElement('div');
    el.className = 'stage';
    const meta = [s.turns ? `${s.turns} turns` : '', fmtMs(s.ms), s.timedOut ? '⚠ timed out' : '', runAt].filter(Boolean).join(' · ');
    el.innerHTML = `<div class="shead"><span class="arrow">▶</span><b>${esc(s.title)}</b><span class="smeta">${esc(meta)}</span></div>`
      + `<div class="sbody">${s.report ? md(s.report) : '<span class="nolog">(transcript not available on this machine)</span>'}</div>`;
    el.querySelector('.shead').onclick = () => el.classList.toggle('open');
    wrap.appendChild(el);
  }
  chatEl().appendChild(wrap);
}

// ---------- transcript rendering ----------
const chatEl = () => $('chat');
const nearBottom = () => { const c = chatEl(); return c.scrollHeight - c.scrollTop - c.clientHeight < 80; };
// The "jump to latest" pill is transient: it shows while you're scrolled up (scrolling or new content
// arriving) and fades away a moment after activity stops, so it isn't a permanent fixture.
let jumpHideTimer = null;
function hideJump() { clearTimeout(jumpHideTimer); $('jumpDown').classList.remove('show'); }
function flashJump() {
  if (S.stick) return hideJump();
  $('jumpDown').classList.add('show');
  clearTimeout(jumpHideTimer);
  jumpHideTimer = setTimeout(() => $('jumpDown').classList.remove('show'), 1600);
}
const scrollBottom = () => { chatEl().scrollTop = chatEl().scrollHeight; S.stick = true; hideJump(); };
// Append-time scroll: only follow new content if the user is already at the bottom; otherwise leave
// their scroll position alone and briefly surface the "jump to latest" pill.
const scroll = () => { if (S.stick) chatEl().scrollTop = chatEl().scrollHeight; else flashJump(); };
function addUser(text, index, atts) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.dataset.text = text; // raw text for reliable dedup (textContent includes the ✏️ + markdown)
  el.innerHTML = md(text);
  if (atts && atts.length) { // show the attached filenames under the message
    const box = document.createElement('div'); box.className = 'atts';
    box.innerHTML = atts.map((n) => `<span class="att">📎 ${esc(n)}</span>`).join('');

// The most meaningful argument per tool — shown inline in the tool header so you don't have to expand.
const TOOL_PRIMARY = { Bash: 'command', Read: 'file_path', Write: 'file_path', Edit: 'file_path', MultiEdit: 'file_path', NotebookEdit: 'notebook_path', Grep: 'pattern', Glob: 'pattern', LS: 'path', Task: 'description', WebFetch: 'url', WebSearch: 'query' };

  el.innerHTML = `<span class="st">▸</span><b>${esc(t.name)}</b>${prev}<span class="inp">${esc(full)}</span>`;

// When the session's context fills past this fraction of the window, every fresh agent reply ends

// fires at ~800k on a 1M window.
const CTX_WARN_FRAC = 0.8;
function ctxWarnInfo() {
  const u = S.detail?.usage;

  const frac = u.contextUsed / u.contextWindow;

}
// Nudge the reader to compact, placed right after the latest agent message. `/compact` is clickable.

  const info = ctxWarnInfo();
  if (!info) return;
  const el = document.createElement('div');
  el.className = 'ctxwarn';
  el.innerHTML = `⚠ This conversation is getting large — ${info.pct}% of the context window (${fmtTok(info.used)} / ${fmtTok(info.win)} tokens). Run <b class="cw-go">/compact</b> to summarize it and free up context.`;
  el.querySelector('.cw-go').onclick = () => startCompact('');

}

    if (m.role === 'user') { const el = addUser(m.text, i, m.attachments); stampTime(el, m.at); }
    else {
      const b = newAssistant();
      if (Array.isArray(m.blocks) && m.blocks.length) {
        for (const bl of m.blocks) { if (bl.t === 'tool') addTool(b, bl); else if (bl.t === 'text') addText(b, bl.text || ''); }
      } else { // legacy messages (no ordered blocks): approximate — tools then text

// After a turn ends, pull the authoritative message list so edit indices, the ✏️ buttons, and the
// commit-warning check reflect what the server persisted (the streamed DOM doesn't update
// S.detail.chat.messages). Skip the re-render if a new turn started or the user is mid-edit, but
// still refresh the data so the next edit decision is made against current state.
async function refreshDetail(id) {
  if (!id) return;
  try {
    const d = await (await fetch(`/api/issues/${id}`)).json();
    if (S.sel !== id || S.busy) return; // a newer turn owns the view now
    S.detail = d;
    // Re-render (to sync ✏️/🗑 + fresh data) only when at the bottom and not mid-edit — otherwise
    // rebuilding the DOM would yank a reader who scrolled up. Data is still refreshed either way.
    if (!S.editing && S.stick) renderAll(d);
  } catch { /* keep the current view */ }
}

// ---------- SSE ----------
let reconnects = 0;
function openEvents(id) {
  reconnects = 0;
  const es = new EventSource(`/api/issues/${id}/events`);
  S.es = es;
  es.onopen = async () => {
    // After a drop, re-render from persisted history; the server replays the current turn.
    if (reconnects++ > 0 && S.sel === id) {
      try {
        const d = await (await fetch(`/api/issues/${id}`)).json();
        if (S.sel === id) { S.detail = d; renderAll(d); S.curBubble = null; setBusy(!!d.busy); }
      } catch { /* retry on next reconnect */ }
    }
  };
  es.onmessage = (ev) => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    if (S.sel !== id) return;
    handleEvent(e);
  };
}
function handleEvent(e) {
  switch (e.type) {
    case 'turn_start': {
      S.curBubble = null; S.lastResult = ''; setBusy(true);
      if (e.compact) { S.compacting = true; setThinking('Summarizing the conversation…'); break; } // no user bubble for /compact
      const msgs = chatEl().querySelectorAll('.msg.user');
      const last = msgs[msgs.length - 1];
      if (!last || last.dataset.text !== e.message) addUser(e.message);
      break;
    }
    case 'init': break;
    case 'status': addSys('⏳ ' + e.text); break;
    case 'compacted': break; // the persisted `compact` marker is rendered by refreshDetail on 'done'
    case 'text':
      if (S.compacting) { setThinking('Summarizing the conversation…'); break; } // suppress the streamed summary; it lands as a compact card
      if (!S.curBubble) S.curBubble = newAssistant();
      addText(S.curBubble, e.text);
      setThinking('Claude is responding…');
      break;
    case 'tool':
      if (S.compacting) break;
      if (!S.curBubble) S.curBubble = newAssistant();
      addTool(S.curBubble, e); // streams inline in chronological order; folds into the accordion on 'done'
      setThinking('Working… (running tools)');
      break;
    case 'tool_result': {
      const chip = chatEl().querySelector(`.tool[data-tid="${e.id}"] .st`);
      if (chip) chip.textContent = e.ok ? '✓' : '✗';
      setThinking('Claude is thinking…');
      break;
    }
    case 'result': S.lastResult = e.text || ''; if (!S.compacting) addTurnMeta(e); break;
    case 'fix_summary': addFixCard(e); break;
    case 'preview':
      if (S.detail) { S.detail.preview = { running: e.running, busy: e.busy, urls: e.urls, refreshing: e.refreshing }; renderPreviewBar(); }
      if (!e.refreshing) addSys(e.running ? '🌐 preview is up' : '⏹ preview stopped');
      break;
    case 'error': addSys('⚠ ' + e.error, 'err'); break;
    case 'aborted': addSys('⏹ aborted', 'err'); break;
    case 'done':
      // Stamp the just-finished assistant bubble now — renderAll (which stamps from the persisted
      // `at`) is skipped when the reader has scrolled up, so don't rely on it for the live message.
      if (S.curBubble) { finalizeAssistant(S.curBubble); stampTime(S.curBubble, new Date().toISOString()); } // fold thoughts+tools into the accordion; the final answer stands out
      S.curBubble = null; S.compacting = false; setBusy(false); loadIssues(); refreshDetail(S.sel);
      // Auto-send the next queued message once the turn ends — unless it was stopped on purpose
      // (Esc/Stop set queuePaused, so a deliberate stop doesn't fire the rest of the queue).
      if (!S.queuePaused && S.queue.length) drainNext();
      // Merge handshake: after the prep turn, if the agent signalled it's green, ask for confirmation.
      if (S.mergePhase === 'prep') { S.mergePhase = null; renderPreviewBar(); if (/\bMERGE_READY\b/.test(S.lastResult)) openMergeConfirm(); }
      else if (S.mergePhase === 'merge') { S.mergePhase = null; renderPreviewBar(); }
      break;
  }
}

// ---------- composer ----------
function setBusy(b) {
  S.busy = b;
  $('send').textContent = b ? 'Stop' : 'Send';
  $('send').classList.toggle('stop', b);
  if (b) setThinking('Claude is working…');
  $('thinking').style.display = b ? 'flex' : 'none';
  if (S.detail) renderPreviewBar(); // keep the Merge button's disabled state in sync with busy
}
function setThinking(label) { $('thinking-label').textContent = label; }
function updateHint() {
  const cap = S.detail?.capability;
  if (!cap) { $('hint').textContent = ''; return; }
  $('hint').innerHTML = cap.level === 'full'
    ? '<span class="cap-full">Full access</span> — ask anything, or request changes: the agent edits this issue\'s branch and new commits auto-push to the open PR.'
    : `Read-only — ${esc(cap.reason || '')}. The agent can answer anything but cannot change code here.`;
  if (V.supported && !V.denied) $('hint').innerHTML += ' <span class="vhint">· Hold <b>space</b> to talk.</span>';

// ---------- edit & rewrite history ----------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Esc flow, step 2: an aborted-before-any-reply message comes back to the composer as a clean redo —
// its user bubble (and the empty aborted turn) is dropped and the session rewound to before it.
async function restoreAborted(text) {
  $('input').value = text || ''; autosize(); $('input').focus();
  // The abort was fired on the first Esc; wait for the turn to fully end before rewinding, or the
  // delete would 409 against a still-active turn. If it never settles, keep the text and bail.
  for (let i = 0; i < 30 && S.busy; i++) await sleep(100);
  if (S.busy || !S.sel) return;
  await refreshDetail(S.sel); // pull the persisted messages so we can find the one we just sent
  const msgs = S.detail?.chat?.messages || [];
  let idx = -1;
  for (let i = msgs.length - 1; i >= 0; i--) { if (msgs[i].role === 'user') { idx = i; break; } }
  if (idx < 0 || msgs[idx].text !== text) return; // safety: only rewind if the tail really is our message
  const r = await fetch(`/api/issues/${S.sel}/chat/delete`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ index: idx, revert: false }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); addSys('⚠ ' + (e.error || `couldn't rewind (${r.status})`), 'err'); return; }
  if (S.detail?.chat?.messages) S.detail.chat.messages = S.detail.chat.messages.slice(0, idx);
  renderAll(S.detail);
  $('input').focus();
  refreshDetail(S.sel);
}
function droppedHasCommits(index) {
  return (S.detail?.chat?.messages || []).slice(index + 1).some((m) => m && m.fix);
}
function highlightTarget(index) {
  for (const el of chatEl().querySelectorAll('.msg.user.editing')) el.classList.remove('editing');
  const t = chatEl().querySelector(`.msg.user[data-idx="${index}"]`);
  if (t) t.classList.add('editing');
}
function beginEdit(index, text) {
  if (S.busy) return;
  S.deleting = null; S.editing = { index };
  $('input').value = text; autosize(); $('input').focus();
  highlightTarget(index);
  renderEditBar();
}
function beginDelete(index) {
  if (S.busy) return;
  S.editing = null; S.deleting = { index };
  highlightTarget(index);
  // Delete doesn't use the composer, so disable it — otherwise it looks usable but Send is a no-op.
  $('input').disabled = true; $('send').disabled = true;
  $('input').placeholder = 'Confirm or cancel the delete above…';
  renderDeleteBar();
}
const COMPOSER_PLACEHOLDER = 'Ask about this fix, or tell the agent what to change…';
// Clears whichever action bar is open. Only wipes the composer if we were editing (delete never
// touches the composer, so cancelling a delete must not clobber text the user was typing).
function clearBars() {
  const wasEditing = !!S.editing;
  S.editing = null; S.deleting = null;
  $('editbar').style.display = 'none'; $('editbar').innerHTML = '';
  for (const el of chatEl().querySelectorAll('.msg.user.editing')) el.classList.remove('editing');
  $('input').disabled = false; $('send').disabled = false;
  $('input').placeholder = COMPOSER_PLACEHOLDER;
  if (wasEditing) { $('input').value = ''; autosize(); }
}
function renderEditBar(mode) {
  const bar = $('editbar');
  if (!S.editing) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  const msgs = S.detail?.chat?.messages || [];
  const below = Math.max(0, msgs.length - S.editing.index - 1);
  bar.style.display = 'flex';
  if (mode === 'confirm') {
    // Only offer the code-revert when the edited message actually has a recorded restore point
    // (full-access turns from this feature onward); otherwise the server can't rewind and would 400.
    const canRevert = !!msgs[S.editing.index]?.headBefore;
    bar.innerHTML = `<span class="warn">⚠ Some of the ${below} message(s) below already pushed commits to the PR — rewriting the chat won't remove them.</span>`
      + `<span class="spacer"></span>${canRevert ? '<button data-a="revert">Revert code + chat</button>' : ''}<button data-a="just">Just chat</button><button data-a="cancel">Cancel</button>`;
    if (canRevert) bar.querySelector('[data-a="revert"]').onclick = () => doEditSend(true);
    bar.querySelector('[data-a="just"]').onclick = () => doEditSend(false);
  } else {
    bar.innerHTML = `✏️ Editing — sending rewrites the conversation and removes the ${below} message(s) below it.`
      + `<span class="spacer"></span><button data-a="cancel">Cancel</button>`;
  }
  bar.querySelector('[data-a="cancel"]').onclick = clearBars;

// Confirmation bar for deleting a message + everything below it (no re-run). Mirrors edit's

function renderDeleteBar() {
  const bar = $('editbar');
  if (!S.deleting) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  const msgs = S.detail?.chat?.messages || [];
  const i = S.deleting.index;
  const below = Math.max(0, msgs.length - i - 1);
  const committed = msgs.slice(i + 1).some((m) => m && m.fix);
  const canRevert = S.detail?.capability?.level === 'full' && committed && !!msgs[i]?.headBefore;

  bar.innerHTML = (committed
    ? `<span class="warn">⚠ Delete this message and the ${below} below it? Some pushed commits won't be removed.</span>`
    : `🗑 Delete this message and the ${below} below it? The agent will forget them.`)
    + `<span class="spacer"></span>${canRevert ? '<button data-a="delrevert">Delete + revert code</button>' : ''}`
    + `<button data-a="del">${committed ? 'Delete (chat only)' : 'Delete'}</button><button data-a="cancel">Cancel</button>`;
  if (canRevert) bar.querySelector('[data-a="delrevert"]').onclick = () => doDelete(true);
  bar.querySelector('[data-a="del"]').onclick = () => doDelete(false);
  bar.querySelector('[data-a="cancel"]').onclick = clearBars;
}
async function doDelete(revert) {
  if (!S.deleting || !S.sel) return;
  const index = S.deleting.index;
  const r = await fetch(`/api/issues/${S.sel}/chat/delete`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ index, revert }),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    addSys('⚠ ' + (err.error || `delete failed (${r.status})`), 'err');
    return; // keep the bar so the user can retry or cancel
  }
  if (S.detail?.chat?.messages) S.detail.chat.messages = S.detail.chat.messages.slice(0, index);
  clearBars();
  if (S.detail) renderAll(S.detail);
  refreshDetail(S.sel); // sync ✏️/🗑 buttons and state with the server
}
async function doEditSend(revert) {
  if (!S.editing || !S.sel) return;
  const index = S.editing.index;
  const message = $('input').value.trim();
  if (!message) return;
  S.lastSent = message; // so an Esc-abort-before-any-reply can restore it (same as a fresh send)
  const backup = S.detail?.chat?.messages ? S.detail.chat.messages.slice() : null;

  // Rewrite the UI to the new state BEFORE sending, so the streamed turn_start (which can only
  // arrive after the server gets this request) sees the edited message already in place and skips
  // re-adding it. Doing this after the await races with turn_start and wipes the message.
  if (S.detail?.chat) {
    S.detail.chat.messages = S.detail.chat.messages.slice(0, index);
    S.detail.chat.messages.push({ role: 'user', text: message });
    S.curBubble = null;
    renderAll(S.detail);
  }
  clearBars();
  setBusy(true);

  const r = await fetch(`/api/issues/${S.sel}/chat/edit`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ index, message, revert }),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    addSys('⚠ ' + (err.error || `edit failed (${r.status})`), 'err');
    if (backup && S.detail?.chat) { S.detail.chat.messages = backup; renderAll(S.detail); } // restore
    setBusy(false);
  }
}

// The composer's primary action (Enter, or the Send button when idle). While a turn is running this
// no longer interrupts it — it QUEUES the message to auto-send when the turn finishes. Stopping is
// done with Esc or the Stop button (which the Send button becomes while busy).
async function send() {
  if (V.recording) return; // mid-dictation (space held): don't send a partial transcript — release first
  if (S.deleting) return;  // a delete confirmation is open — use its buttons, don't send a new message
  if (S.editing) {
    const message = $('input').value.trim();
    if (!message) return;
    const full = S.detail?.capability?.level === 'full';
    if (full && droppedHasCommits(S.editing.index)) { renderEditBar('confirm'); return; }
    await doEditSend(false);
    return;
  }
  const message = $('input').value.trim();
  const atts = S.attachments;
  if (!message && !atts.length) { if (!S.busy && S.queue.length) drainNext(); return; } // empty Enter resumes a paused queue
  if (!S.sel) return;
  if (message[0] === '/' && !atts.length) { hideSlash(); $('input').value = ''; autosize(); runCommand(message); return; } // slash command
  S.attachments = []; renderAttachments(); // consume the composer's attachments for this send
  if (S.busy) { queueMessage(message, atts); return; } // a turn is running — queue it instead of interrupting
  $('input').value = ''; autosize();

  const reset = resetsAt ? `resets ${esc(fmtReset(resetsAt))}` : '';
  return `<div class="ubar"><div class="ubl"><span>${esc(label)}</span><span class="ubp">${p}%</span></div>`
    + `<div class="utrack"><i class="ufill ${sev}" style="width:${p}%"></i></div>`
    + `<div class="ubr">${reset}</div></div>`;
}
// Account-wide usage/limits for the logged-in Claude subscription (from /api/usage → /api/oauth/usage).
function renderUsage(r) {
  if (!r || !r.ok) return `<div class="pempty">Usage unavailable${r && r.error ? ` — ${esc(r.error)}` : ''}.</div>`;
  const g = r.usage || {};
  const bars = [
    usageBar('Current session · 5-hour limit', g.five_hour?.utilization, g.five_hour?.resets_at),
    usageBar('This week · all models', g.seven_day?.utilization, g.seven_day?.resets_at),
    usageBar('This week · Opus', g.seven_day_opus?.utilization, g.seven_day_opus?.resets_at),
    usageBar('This week · Sonnet', g.seven_day_sonnet?.utilization, g.seven_day_sonnet?.resets_at),
  ].filter(Boolean).join('');
  const sp = g.spend || {}, ex = g.extra_usage || {};
  const creditsOn = !!(sp.enabled || ex.is_enabled);
  let credits;
  if (creditsOn && ex.used_credits != null) credits = `on · ${ex.used_credits} used`;
  else credits = creditsOn ? 'on' : 'off';
  return `<div class="usagewrap">${bars || '<div class="pempty">No limit data.</div>'}</div>`
    + kRow('Usage credits', credits);
}
async function openStatus() {
  const d = S.detail;
  openCmd('Status', '<div class="csub">Account usage</div><div class="pempty">Loading usage…</div>');
  let usageHtml = '<div class="pempty">Usage unavailable.</div>';
  try { usageHtml = renderUsage(await (await fetch('/api/usage')).json()); }
  catch (e) { usageHtml = `<div class="pempty">Couldn't load usage — ${esc(String(e.message || e))}.</div>`; }
  let issueHtml = '';
  if (d) {
    const lvl = d.capability?.level;
    const model = (lvl && d.models ? d.models[lvl] : '') || '—';
    const pr = (d.entry?.prs || []).map((p) => p.url).filter(Boolean);
    issueHtml = '<div class="csub">This issue</div>' + [
      kRow('Issue', d.identifier + (d.linear?.title ? ' — ' + d.linear.title : '')),
      kRow('Mode', (lvl === 'full' ? 'Full access' : 'Read-only') + '  ·  ' + model),
      kRow('Session', d.chat?.sessions?.[lvl] || '—'),
      kRow('Branch', d.entry?.branch || '—'),
      kRow('PR', pr.length ? pr.join('   ') : '—'),
      kRow('Worktree', d.worktree?.exists ? 'present' : 'none'),
      kRow('Messages', String((d.chat?.messages || []).length)),
      kRow('Turns (last run)', d.usage?.turns != null ? String(d.usage.turns) : '—'),
      kRow('Cost (session)', d.costTotal ? '$' + d.costTotal.toFixed(4) : '—'),
      kRow('Fix engine', d.fixEnabled ? 'enabled' : 'disabled'),
    ].join('');
  }
  // Only patch the body if the Status overlay is still the one open (user may have closed it).
  if (S.cmd === 'Status') { const b = document.querySelector('#cmd .cbody'); if (b) b.innerHTML = '<div class="csub">Account usage</div>' + usageHtml + issueHtml; }
}
const fmtTok = (n) => (n >= 1e6 ? String(+(n / 1e6).toFixed(1)) + 'M' : n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n));
function openContext() {
  const d = S.detail; if (!d) return;
  const u = d.usage;
  if (!u || !u.contextUsed || !u.contextWindow) { openCmd('Context', '<div class="pempty">No context data yet — send a message in this session first, then reopen /context.</div>'); return; }
  const used = u.contextUsed, win = u.contextWindow, free = Math.max(0, win - used);
  const CELLS = 100, usedCells = Math.max(0, Math.min(CELLS, Math.round(used / win * CELLS)));
  const grid = Array.from({ length: CELLS }, (_, k) => (k < usedCells ? '<i class="used"></i>' : '<i></i>')).join('');
  const pc = (n) => (n / win * 100).toFixed(1);
  const html = kRow('Model', u.model || '—') + kRow('Window', fmtTok(win) + ' tokens')
    + `<div class="cgrid">${grid}</div>`
    + '<div class="clegend">'
    + `<div class="ci"><span class="sw" style="background:var(--accent)"></span>Used ${fmtTok(used)} (${pc(used)}%)</div>`
    + `<div class="ci"><span class="sw" style="background:var(--border)"></span>Free ${fmtTok(free)} (${pc(free)}%)</div>`
    + '</div>'
    + kRow('Session cost', d.costTotal ? '$' + d.costTotal.toFixed(4) : '—')
    + '<div class="cnote">“Used” covers the system prompt, tools, and the whole conversation together — the CLI doesn’t report them as separate categories.</div>';
  openCmd('Context', html);
}

document.addEventListener('keydown', (ev) => {
  if (V.recording || V.pressActive) return; // Esc stays out of voice — dictation is cleared with select-all+delete
  // Ctrl/Cmd+B or Alt+Enter toggles the sidebar.
  if (((ev.key === 'b' || ev.key === 'B') && (ev.ctrlKey || ev.metaKey)) || (ev.key === 'Enter' && ev.altKey)) {
    ev.preventDefault(); setSidebar(!document.body.classList.contains('side-collapsed')); return;
  }
  // Ctrl/Cmd+Down jumps to the latest message (the "New messages" pill's shortcut).
  if (ev.key === 'ArrowDown' && (ev.ctrlKey || ev.metaKey)) { if (S.sel) { ev.preventDefault(); scrollBottom(); } return; }
  // Ctrl/Cmd+O toggles the "work" accordion of the bubble in focus — the one under the pointer — or,
  // when none is focused, the latest assistant bubble's.
  if ((ev.key === 'o' || ev.key === 'O') && (ev.ctrlKey || ev.metaKey)) {
    const hovered = chatEl().querySelector('.msg.assistant:hover');
    let work = hovered ? hovered.querySelector('.work') : null;
    if (!work) { const all = chatEl().querySelectorAll('.msg.assistant .work'); work = all[all.length - 1] || null; }
    if (work) { ev.preventDefault(); work.classList.toggle('open'); }
    return;
  }
  if (S.cmd) { if (ev.key === 'Escape') { ev.preventDefault(); closeCmd(); } return; } // /status or /context overlay
  if (S.picker) { // picker owns the keyboard while open
    if (ev.key === 'Escape') { ev.preventDefault(); closePicker(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); movePicker(-1); }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); movePicker(1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); pickPicker(); }
    return;
  }
  // Press '/' anywhere to jump into the composer (like Google/YouTube search). Skip when already
  // typing in a field or holding a modifier; the '/' isn't inserted, just focus. Modals returned above.
  if (ev.key === '/' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
    const composer = $('composer');
    if (!typing && S.sel && composer && composer.style.display !== 'none') { ev.preventDefault(); $('input').focus(); return; }
  }

  if (ev.key !== 'Escape') return;
  if (S.editing || S.deleting) { ev.preventDefault(); clearBars(); return; } // Esc cancels an open edit/delete

  // Claude-Code-style Esc burst — only while Claude hasn't put ANYTHING in the bubble yet:
  //   1st Esc: abort the turn   2nd Esc: bring the message back to the composer (clean redo)   3rd Esc: picker.
  // (2) Restore step — a consecutive Esc right after a no-activity abort.
  if (S.escArmed && ev.timeStamp - S.escArmed < 600) {
    ev.preventDefault();
    const text = S.escText; S.escArmed = 0;
    S.lastEsc = ev.timeStamp; // keep the burst alive so the next Esc opens the picker
    restoreAborted(text);
    return;
  }
  S.escArmed = 0; // the arm is single-use and only survives the immediately-following key

  if (S.busy) { // (1) Esc stops the running turn; arm the restore iff no reply/tool has appeared yet
    ev.preventDefault();
    if (!S.curBubble) { S.escArmed = ev.timeStamp; S.escText = S.lastSent || ''; }
    S.lastEsc = 0;
    stopTurn();
    return;
  }
  // (3) Idle: Esc-Esc (double within 400ms) opens the jump-to-message picker.
  if (ev.timeStamp - S.lastEsc < 400) { S.lastEsc = 0; ev.preventDefault(); openPicker(); }
  else S.lastEsc = ev.timeStamp;
});

// ---------- sidebar collapse ----------
function setSidebar(collapsed) {
  document.body.classList.toggle('side-collapsed', collapsed);
  try { localStorage.setItem('sideCollapsed', collapsed ? '1' : '0'); } catch { /* private mode */ }
}
$('sideToggle').onclick = () => setSidebar(true);
$('sideOpen').onclick = () => setSidebar(false);
try { if (localStorage.getItem('sideCollapsed') === '1') setSidebar(true); } catch { /* ignore */ }

// ---------- boot ----------
loadIssues();
setInterval(loadIssues, 30000);
// Restore the issue named in the URL hash (a refresh, a bookmark, or a shared link), and follow
// later hash changes (back/forward, manual edits). select() no-ops when it's already the open one.
const hashId = () => decodeURIComponent(location.hash.replace(/^#/, '')).trim();
if (hashId()) select(hashId());
window.addEventListener('hashchange', () => { const id = hashId(); if (id && id !== S.sel) select(id); });
</script>
</body>
</html>
