# Increase proxy buffer sizes to prevent large API responses from being
# buffered to disk (which causes truncated responses when the instance volume
# is under temp-file/log pressure).
# Default: proxy_buffer_size 4k; proxy_buffers 8 4k (32KB total)
# New: proxy_buffer_size 64k; proxy_buffers 64 64k (4MB total)
# Admin user exports are currently ~2MB, so keep them in memory and do not
# spill oversized upstream responses to nginx temp files.

proxy_buffer_size 64k;
proxy_buffers 64 64k;
proxy_busy_buffers_size 128k;
proxy_max_temp_file_size 0;
