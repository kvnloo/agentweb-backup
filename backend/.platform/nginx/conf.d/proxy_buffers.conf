# Increase proxy buffer sizes to prevent large API responses from being
# buffered to disk (which causes slow/frozen page loads for accounts with
# many sessions or reports).
# Default: proxy_buffer_size 4k; proxy_buffers 8 4k (32KB total)
# New: proxy_buffer_size 16k; proxy_buffers 16 16k (256KB total)
# This handles responses up to ~256KB without hitting the temp file path.

proxy_buffer_size 16k;
proxy_buffers 16 16k;
proxy_busy_buffers_size 32k;
