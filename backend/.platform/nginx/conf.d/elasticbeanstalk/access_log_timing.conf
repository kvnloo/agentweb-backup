# Additional access log with request timing. EB's nginx.conf already declares
# `access_log /var/log/nginx/access.log main;` in the server block, and nginx
# writes to EVERY access_log at the same level, so this must be a separate
# file — pointing it at access.log would log each request twice.
# Rotated by EB's existing /var/log/nginx/* hourly logrotate rule.
access_log /var/log/nginx/access_timing.log main_timing;
