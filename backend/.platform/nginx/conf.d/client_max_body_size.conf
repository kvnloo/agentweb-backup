client_max_body_size 120M;

# Mobile screenshots and pasted images are multipart uploads. Keep common
# image-sized bodies in memory; larger bodies spill to nginx's stock client-body
# temp path (/var/lib/nginx/tmp/client_body), which the EB platform provisions
# and which exists inside nginx's systemd /var/tmp namespace.
#
# Do NOT point client_body_temp_path at a custom dir under /var/tmp: on the
# AL2023 platform nginx runs with a private /var/tmp namespace, so a host-created
# dir is invisible to nginx and it fails to start with
#   nginx: [emerg] mkdir() "/var/tmp/agentweb-nginx/client_body" failed (ENOENT)
# Large API *responses* (e.g. /admin/users) are kept off disk via the in-memory
# buffers in proxy_buffers.conf, not via a custom temp dir.
client_body_buffer_size 16M;
