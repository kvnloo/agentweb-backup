# Access-log format with request timing (http context).
# Identical to EB's default "main" format, with $request_time and
# $upstream_response_time APPENDED so existing positional parsers
# (e.g. the prod3-auth-401-403 CloudWatch metric filter) keep working.
# Used by elasticbeanstalk/access_log_timing.conf (server context) to feed
# the per-route p99 latency alarm (excludes /api/agent-mode/* and /mcp).
log_format main_timing '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time urt=$upstream_response_time';
