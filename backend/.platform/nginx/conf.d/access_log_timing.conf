# Request-timing access log format (http context).
# EB's default "main" format with $request_time / $upstream_response_time
# appended as BARE numbers (CloudWatch metric filters can only emit a
# numeric field as a metric value; "rt=0.006" is not numeric). Written to a SEPARATE file (access_timing.log) by
# elasticbeanstalk/access_log_timing.conf, so /var/log/nginx/access.log and
# anything parsing it (e.g. the prod3-auth-401-403 metric filter) are untouched.
log_format main_timing '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       '$request_time $upstream_response_time';
