# Proxy timeouts for long-running Agent Mode / scheduled-chat operations.
#
# ENG-818 — these MUST stay strictly greater than the application's own generation cap
# (AGENT_MODE_GENERATION_TIMEOUT_MS, default 600s, agentModeController.ts).
#
# Every layer used to sit at exactly 600s. The app's cap fired at T=600s and then still
# needed time to unwind, build the timeout-continuation message, persist it and serialize
# JSON — but nginx hit its deadline at that same instant and returned its own raw HTML 504
# first. Callers never saw the application's structured response, which left the graceful
# degradation from ENG-190/287/317/472/510 unreachable in production.
#
# This does NOT let requests run longer: the app still gives up at 600s. The extra 60s is
# purely delivery headroom so its answer can get out.
#
# Ordering invariant, asserted by src/__tests__/timeoutLayerOrdering.test.ts:
#   app 600s  <  nginx 660s  <  ALB IdleTimeout 720s  <=  DeregistrationDelay 720s

# Time to *establish* the upstream connection. Deliberately not part of the ordering
# above — the upstream is local, so this never approaches the response-timeout budget.
proxy_connect_timeout 600s;

# Time spent sending to / reading from the upstream. These are the two that race the
# application's cap, so they carry the headroom.
proxy_send_timeout 660s;
proxy_read_timeout 660s;
